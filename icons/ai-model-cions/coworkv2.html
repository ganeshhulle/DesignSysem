<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoFinOps — Oscar Tinted-Surface (Option D)</title>
<style>
:root{
  --background:#fff;--foreground:#172B4D;--primary:#172B4D;--primary-fg:#fff;
  --secondary:#F5F5F5;--muted:#F5F5F5;--muted-fg:#637087;--accent:#EBF5FF;
  --destructive:#C4461E;--border:#E1E4E9;--input-bg:#FCFDFF;--switch-bg:#C8CDD5;--ring:#0076E1;
  --success:#36B37E;--success-l:#EEFFF8;--warning:#F5CC00;--warning-l:#FFFAE4;
  --error:#C4461E;--error-l:#FEEEE9;--info:#0076E1;--info-l:#EBF5FF;
  --agent-cost:#7C3AED;--agent-usage:#00B8D9;--agent-rate:#36B37E;--agent-anomaly:#F5CC00;--agent-budget:#E6147F;
  --glass-bg:#FFFFFF;--glass-border:#D6E4F5;--glass-shadow:0px 4px 16px 0px rgba(23,43,77,0.08);
  --r:12px;--r-sm:4px;--r-md:8px;--r-xl:12px;--r-2xl:16px;
  --sh-sm:0px 3px 16px 0px #ECECEC;--sh-md:0px 4px 21px 0px rgba(0,0,0,0.08);--sh-lg:0px 8px 32px rgba(23,43,77,0.12);
  /* OSCAR icon tokens */
  --icon-size-xs:12px;--icon-size-sm:16px;--icon-size-md:20px;--icon-size-lg:24px;--icon-size-xl:32px;
  --icon-color-default:#637087;--icon-color-muted:#959FAE;--icon-color-brand:#0076E1;--icon-color-success:#36B37E;--icon-color-warning:#F5CC00;--icon-color-danger:#C4461E;--icon-color-disabled:#C8CDD5;--icon-color-on-dark:#FFFFFF;
  --icon-gap-sm:4px;--icon-gap-md:8px;--icon-gap-lg:12px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --fw-med:600;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{font-family:var(--font);color:var(--foreground);line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden;height:100vh}
button{font-family:inherit;cursor:pointer}
.svg{width:1em;height:1em;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none;flex:none;vertical-align:-.125em}

/* ===== app shell ===== */
.app{display:flex;height:100vh;position:relative;background:#F5F6FB;}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(80px,-80px) scale(1.1)}66%{transform:translate(-50px,50px) scale(.9)}}

/* ===== OSCAR Left Navigation ===== */
.nav{width:80px;flex:none;height:100vh;background:#fff;box-shadow:0 2px 10px 0 #efefef;display:flex;flex-direction:column;padding:22px 16px 0;gap:4px;overflow:hidden;transition:width .25s ease,box-shadow .25s ease;position:relative;z-index:10;font-family:'Nunito Sans',var(--font)}
.nav.expanded{width:250px;box-shadow:0 3px 16px 0 #ececec}
.nav-logo-wrap{padding-left:4px;padding-bottom:20px;flex-shrink:0;display:flex;align-items:center;gap:8px;overflow:hidden}
.nav-logo-mark-svg{display:block;flex-shrink:0;width:40px;height:24px}
.nav-logo-word{font-size:17px;font-weight:800;color:#172B4D;white-space:nowrap;opacity:0;transition:opacity .15s ease .05s;letter-spacing:-.02em}
.nav.expanded .nav-logo-word{opacity:1}
.nav-scroll{flex:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:4px;scrollbar-width:thin;scrollbar-color:#E1E4E9 transparent}
.nav-scroll::-webkit-scrollbar{width:3px}.nav-scroll::-webkit-scrollbar-thumb{background:#E1E4E9;border-radius:2px}
.l1-item{display:flex;flex-direction:column;flex-shrink:0}
.l1-trigger{display:flex;align-items:center;gap:8px;width:48px;height:48px;padding:12px;border-radius:8px;cursor:pointer;background:transparent;border:none;transition:background .12s,width .25s ease,padding .25s ease;overflow:hidden;white-space:nowrap;flex-shrink:0;font-family:inherit}
.nav.expanded .l1-trigger{width:218px;height:auto;min-height:48px;padding:12px 20px}
.l1-trigger:hover{background:#EBF5FF}
.l1-item.active>.l1-trigger{background:#E3F1FF}
.l1-item.active>.l1-trigger .l1-icon,.l1-trigger:hover .l1-icon{color:#0076E1}
.l1-icon{width:24px;height:24px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#637087;transition:color .12s}
.l1-icon svg{display:block;width:22px;height:22px}
.l1-label{font-size:13px;font-weight:700;color:#172B4D;white-space:nowrap;flex:1;text-align:left;opacity:0;transition:opacity .15s ease .05s}
.nav.expanded .l1-label{opacity:1}
.l2-container{display:none;flex-direction:column;gap:4px;padding:4px 0 4px 16px}
.nav.expanded .l1-item.open .l2-container{display:flex}
.l2-trigger{display:flex;align-items:center;width:202px;height:32px;padding:8px 16px 8px 12px;border-radius:8px;cursor:pointer;background:transparent;border:none;font-family:inherit;font-size:13px;font-weight:400;color:#172B4D;text-align:left;transition:background .12s;white-space:nowrap;overflow:hidden;flex-shrink:0}
.l2-trigger:hover{background:#EBF5FF}
.l2-trigger.active-l2{background:#EBF5FF;font-weight:700}
.l2-label{flex:1;text-align:left}
/* L2 parent that owns an L3 group (caret + expand) */
.l2-trigger.has-l3{padding-right:10px}
.l2-caret{width:14px;height:14px;flex:none;margin-left:auto;color:#637087;display:flex;align-items:center;justify-content:center;transition:transform .2s}
.l2-caret svg{width:12px;height:12px}
.l2-group.open>.l2-trigger .l2-caret{transform:rotate(90deg)}
.l2-group.open>.l2-trigger{font-weight:700}
.l3-container{display:none;flex-direction:column;gap:2px;padding:2px 0 4px 14px}
.l2-group.open .l3-container{display:flex}
.l3-trigger{display:flex;align-items:center;width:188px;height:30px;padding:6px 12px;border-radius:8px;cursor:pointer;background:transparent;border:none;font-family:inherit;font-size:12.5px;font-weight:400;color:#172B4D;text-align:left;transition:background .12s;white-space:nowrap;overflow:hidden;flex-shrink:0}
.l3-trigger:hover{background:#EBF5FF}
.l3-trigger.active-l3{background:#EBF5FF;font-weight:700;color:#0076E1}
.l3-label{flex:1;text-align:left}
body.dark .l3-trigger{color:#E6EAF2}
body.dark .l3-trigger:hover{background:#1E2A44}
body.dark .l3-trigger.active-l3{background:#1E2A44;color:#3B82F6}
body.dark .l2-caret{color:#94A3B8}
.nav-footer{border-top:1px solid #E1E4E9;padding:16px 12px;display:flex;flex-direction:column;gap:18px;flex-shrink:0;overflow:hidden}
.nav.expanded .nav-footer{padding:16px 20px}
.nav-footer-item{display:flex;align-items:center;gap:8px;cursor:pointer;border:none;background:transparent;font-family:inherit;padding:0;overflow:hidden}
.nav-footer-icon{width:24px;height:24px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#637087;transition:color .12s}
.nav-footer-icon svg{display:block;width:20px;height:20px}
.nav-footer-item:hover .nav-footer-icon{color:#0076E1}
.nav-footer-label{font-size:13px;font-weight:700;color:#172B4D;white-space:nowrap;opacity:0;transition:opacity .15s ease .05s}
.nav.expanded .nav-footer-label{opacity:1}
.nav-toggle{position:absolute;top:28px;right:-12px;width:24px;height:24px;border-radius:50%;background:#fff;border:1px solid #E1E4E9;box-shadow:0 2px 6px rgba(0,0,0,.08);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:100}
.nav-toggle svg{width:10px;height:10px;color:#637087;transition:transform .25s}
.nav.expanded .nav-toggle svg{transform:rotate(180deg)}

/* main column */
.main{flex:1;display:flex;flex-direction:column;min-width:0;z-index:2}

/* ===== OSCAR Top Bar (tenant-only mode · hasCloudAccount=false) ===== */
:root{
  --tb-bg:#FFFFFF; --tb-h:66px; --tb-py:13px; --tb-pr:31px; --tb-pl:24px;
  --tb-shadow:4px 0px 20px 0px rgba(25,112,191,0.15);
  --tb-bc-gap:12px;
  --tb-dd-group-gap:10px;            /* gap between dropdowns (token) */
  --tb-dd-tenant-w:200px;            /* Tenant dropdown width (token) */
  --tb-dd-h:40px; --tb-dd-bg:#FCFDFF; --tb-dd-border:1px solid #E1E4E9;
  --tb-dd-radius:8px; --tb-dd-px:16px; --tb-dd-gap:8px;
}
.tb{flex:none;height:var(--tb-h);background:var(--tb-bg);box-shadow:var(--tb-shadow);
  display:flex;align-items:center;justify-content:space-between;position:relative;
  padding:var(--tb-py) var(--tb-pr) var(--tb-py) var(--tb-pl);
  font-family:'Nunito Sans',var(--font);z-index:9}
.tb__breadcrumb{display:flex;gap:var(--tb-bc-gap);align-items:center;flex-shrink:0}
.tb__bc-home{width:16px;height:14px;cursor:pointer;flex-shrink:0;color:#637087;display:flex;align-items:center}
.tb__bc-sep{flex-shrink:0;color:#637087;display:flex;align-items:center}
.tb__bc-parent{font-size:12px;font-weight:700;color:#0076E1;white-space:nowrap;cursor:pointer;text-decoration:none}
.tb__bc-parent:hover{text-decoration:underline}
.tb__bc-current{font-size:12px;font-weight:700;color:#637087;white-space:nowrap;cursor:default}
.tb .seg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.tb__dropdowns{display:flex;gap:var(--tb-dd-group-gap);align-items:center;flex-shrink:0}
.tb__dropdown{display:flex;align-items:center;gap:var(--tb-dd-gap);height:var(--tb-dd-h);
  padding:8px var(--tb-dd-px);background:var(--tb-dd-bg);border:var(--tb-dd-border);
  border-radius:var(--tb-dd-radius);cursor:pointer;transition:border-color .12s}
.tb__dropdown:hover{border-color:#C8CDD5}
.tb__dropdown--tenant{width:var(--tb-dd-tenant-w)}
.tb__dd-label{font-size:14px;font-weight:400;color:#959FAE;white-space:nowrap}
.tb__dd-value{font-size:14px;font-weight:400;color:#172B4D;white-space:nowrap;flex:1}
.tb__dd-arrow{width:16px;height:16px;flex-shrink:0;color:#172B4D;display:flex;align-items:center}

.seg{display:inline-flex;background:rgba(255,255,255,.85);border:1px solid var(--glass-border);border-radius:9999px;padding:4px;box-shadow:var(--sh-sm)}
.seg button{border:none;background:transparent;font-weight:var(--fw-med);font-size:13px;padding:7px 20px;border-radius:9999px;color:var(--muted-fg)}
.seg button.on{background:var(--primary);color:#fff}

/* content area with optional progress sidebar */
.stage{flex:1;display:flex;gap:24px;padding:24px;overflow:hidden}
.scroll{flex:1;overflow-y:auto;padding:0 0 24px}
.scroll::-webkit-scrollbar{width:8px}.scroll::-webkit-scrollbar-thumb{background:rgba(0,0,0,.12);border-radius:8px}

/* progress sidebar */
.progress{width:300px;flex:none;background:var(--glass-bg);border:1px solid var(--glass-border);
  border-radius:var(--r-2xl);box-shadow:var(--glass-shadow);padding:20px;display:flex;flex-direction:column;overflow-y:auto}
.progress .ph{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-fg);font-weight:var(--fw-med);display:flex;align-items:center;gap:8px;margin-bottom:18px}
.progress .ph .dot{width:7px;height:7px;border-radius:50%;background:var(--info);box-shadow:0 0 0 3px var(--info-l)}
.step{display:flex;gap:12px;padding-bottom:18px;position:relative}
.step:not(:last-child)::after{content:"";position:absolute;left:13px;top:28px;bottom:2px;width:2px;background:var(--border)}
.step .num{width:26px;height:26px;flex:none;border-radius:50%;border:2px solid var(--border);display:grid;place-items:center;font-size:12px;font-weight:var(--fw-med);color:var(--muted-fg);background:#fff;z-index:1}
.step.done .num{background:var(--success);border-color:var(--success);color:#fff}
.step.active .num{border-color:var(--info);color:var(--info)}
.step .stitle{font-weight:var(--fw-med);font-size:14px}
.step.pending .stitle{color:var(--muted-fg)}
.step .sdesc{font-size:12px;color:var(--muted-fg);margin-top:3px}
.step .sub{font-size:12px;color:var(--muted-fg);margin-top:6px;display:flex;flex-direction:column;gap:4px}
.step .sub span{display:flex;align-items:center;gap:6px}
.step .sub span::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--success)}
.progress .foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--border)}
.progress .foot .lbl{display:flex;justify-content:space-between;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-fg);font-weight:var(--fw-med)}
.progress .foot .lbl b{color:var(--info)}
.pbar{height:6px;border-radius:9999px;background:var(--muted);overflow:hidden;margin:8px 0}
.pbar i{display:block;height:100%;background:var(--info);border-radius:9999px;transition:width .5s cubic-bezier(0,0,.2,1)}
.progress .foot .stat{text-align:center;font-size:12px;color:var(--muted-fg);margin-top:8px}

/* glass card */
.glass{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:var(--r-2xl);box-shadow:var(--glass-shadow);padding:24px}
.center-wrap{max-width:none;margin:0;width:100%}

h1.page{font-size:30px;font-weight:var(--fw-med);letter-spacing:-.02em;margin-bottom:6px}
.sub-lede{color:var(--muted-fg);font-size:15px;margin-bottom:24px}

/* buttons */
.btn{font-size:14px;font-weight:var(--fw-med);border:none;border-radius:var(--r-md);height:38px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{filter:brightness(1.25)}
.btn-outline{background:#fff;border:1px solid var(--border);color:var(--foreground)}.btn-outline:hover{background:var(--accent)}
.btn-disabled{background:#eaf0f6;color:#aeb7c4;pointer-events:none}
.btn-lg{height:44px;padding:0 24px;border-radius:9999px}

/* composer */
.composer{background:rgba(255,255,255,.85);border:1px solid var(--glass-border);border-radius:var(--r-xl);padding:18px 20px;box-shadow:var(--sh-sm)}
.composer textarea{width:100%;border:none;background:transparent;resize:none;font-family:inherit;font-size:15px;outline:none;color:var(--foreground);min-height:26px}
.composer .row{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.icobtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:#fff;display:grid;place-items:center;color:var(--muted-fg)}
.sendbtn{height:38px;padding:0 18px;border-radius:9999px;background:var(--primary);color:#fff;border:none;display:inline-flex;align-items:center;gap:8px;font-weight:var(--fw-med);font-size:14px}

/* predefined outcome cards */
.predef{display:flex;align-items:center;gap:16px;background:rgba(255,255,255,.6);border:1px solid var(--glass-border);border-radius:var(--r-xl);padding:18px 20px;margin-top:14px;transition:.15s;text-align:left;width:100%}
.predef:hover{background:rgba(255,255,255,.85);transform:translateY(-1px);box-shadow:var(--sh-md)}
.predef.sel{outline:none;box-shadow:inset 0 0 0 2px var(--info)}
.predef .pico{width:30px;height:30px;flex:none;border-radius:8px;background:var(--info-l);color:var(--info);display:grid;place-items:center}
.predef .ptext{font-size:14px}
.predef .chk{margin-left:auto;width:26px;height:26px;border-radius:7px;background:var(--info);color:#fff;display:grid;place-items:center;flex:none}

/* outcome banner */
.banner{display:flex;align-items:center;gap:16px;margin-bottom:22px}
.banner .bico{width:42px;height:42px;border-radius:11px;background:var(--info-l);color:var(--info);display:grid;place-items:center;flex:none}
.banner h2{font-size:18px;font-weight:var(--fw-med)}
.banner .bsub{font-size:13px;color:var(--muted-fg)}
.banner .ring{margin-left:auto}

/* prereq/status cards */
.statc{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r);background:#fff;margin-bottom:10px}
.statc.ok{background:var(--success-l)}.statc.warn{background:var(--warning-l)}
.statc .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.6);flex:none}
.statc .t{font-weight:var(--fw-med);font-size:14px}.statc .s{font-size:13px;color:var(--muted-fg)}
.statc .end{margin-left:auto}

/* ════════ Prerequisites — status-led list rows (Option A) ════════ */
.preq-list{margin-top:4px;border-top:1px solid var(--border)}
.preq-row{position:relative;display:flex;align-items:center;gap:14px;padding:16px 16px 16px 18px;
  border-bottom:1px solid var(--border);transition:background .25s}
.preq-row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:transparent;transition:background .25s}
.preq-row.is-ok::before{background:var(--success)}
.preq-row.is-warn::before{background:var(--warning)}
.preq-row.is-checking{background:rgba(0,118,225,.03)}
.preq-row.is-checking::before{background:var(--info);opacity:.5}
.preq-ico{width:30px;height:30px;display:grid;place-items:center;flex:none;color:var(--muted-fg);transition:color .25s}
.preq-ico svg{width:21px;height:21px}
.preq-row.is-ok .preq-ico{color:var(--success)}
.preq-row.is-warn .preq-ico{color:var(--warning)}
.preq-main{flex:1;min-width:0}
.preq-main .t{font-weight:var(--fw-med);font-size:14px;color:var(--foreground)}
.preq-main .s{font-size:12.5px;color:var(--muted-fg);margin-top:2px}
.preq-status{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:var(--fw-med);
  padding:5px 12px;border-radius:9999px;white-space:nowrap;transition:.25s}
.preq-status svg{width:14px;height:14px}
.ps-checking{color:var(--muted-fg);background:var(--muted)}
.ps-ok{color:var(--success);background:var(--success-l)}
.ps-warn{color:var(--warning);background:var(--warning-l)}
/* dark theme adaptation */
body.dark .preq-list{border-top-color:#2A3550}
body.dark .preq-row{border-bottom-color:#2A3550}
body.dark .preq-row.is-checking{background:rgba(59,151,255,.06)}
body.dark .preq-ico{color:#94A3B8}
body.dark .preq-main .t{color:#E6EAF2}
body.dark .preq-main .s{color:#94A3B8}
body.dark .ps-checking{color:#94A3B8;background:#1B2336}
body.dark .ps-ok{color:#36B37E;background:rgba(47,213,151,.14)}
body.dark .ps-warn{color:#F5CC00;background:rgba(245,204,0,.14)}

/* signal cards */
.sig{background:rgba(255,255,255,.75);border:1px solid var(--glass-border);border-radius:var(--r-xl);padding:18px 20px;margin-bottom:12px;display:flex;justify-content:space-between;gap:16px;transition:.15s}
.sig:hover{background:#fff;transform:translateY(-1px);box-shadow:var(--sh-md)}
.sig .st{font-weight:var(--fw-med);font-size:15px}
.sig .ss{font-size:13px;color:var(--muted-fg);margin-top:2px}
.sig .meta{display:flex;gap:14px;align-items:center;margin-top:10px;font-size:13px}
.sig .save{color:var(--success);font-weight:var(--fw-med);display:inline-flex;gap:4px;align-items:center}
.sig .agent{color:var(--info);font-weight:var(--fw-med);display:inline-flex;gap:4px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:9999px;padding:3px 10px;font-size:12px;font-weight:var(--fw-med)}
.pill-high{background:var(--error);color:#fff}.pill-med{background:var(--warning);color:#5a3c00}
.spark{align-self:center}

/* tabs */
.tabs{display:flex;gap:8px;border-bottom:1px solid var(--border);margin:8px 0 20px}
.tabs button{background:none;border:none;font-size:14px;font-weight:var(--fw-med);color:var(--muted-fg);padding:10px 14px;border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;gap:6px;align-items:center}
.tabs button.on{color:var(--info);border-bottom-color:var(--info)}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.kpi{background:#fff;border-radius:var(--r);padding:16px;box-shadow:var(--sh-sm)}
.kpi .v{font-size:24px;font-weight:600;color:var(--info)}.kpi .k{font-size:12px;color:var(--muted-fg);margin-top:2px}

/* dashboard list */
.dash-stat{display:flex;align-items:center;gap:14px;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:var(--r-xl);padding:18px;box-shadow:var(--sh-sm)}
.dash-stat .di{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none}
.dash-stat .dv{font-size:22px;font-weight:600}.dash-stat .dk{font-size:13px;color:var(--muted-fg)}
.outcome-row{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:var(--r-xl);padding:18px 20px;margin-bottom:12px;box-shadow:var(--sh-sm);cursor:pointer;transition:.15s}
.outcome-row:hover{transform:translateY(-1px);box-shadow:var(--sh-md)}
.outcome-row .orh{display:flex;justify-content:space-between;align-items:center}
.outcome-row .ot{font-weight:var(--fw-med);font-size:15px}

.agx2-chatitem .t{display:block;font-size:13px;font-weight:var(--fw-med);color:var(--foreground);line-height:1.3;

.agx2-histempty{padding:18px 8px;font-size:12.5px;color:var(--muted-fg);text-align:center}
.agx2-sect{display:flex;align-items:center;justify-content:space-between;padding:12px 4px 6px;margin-top:10px;
  border-top:1px solid var(--border);font-size:13px;font-weight:var(--fw-med);color:var(--foreground)}
.agx2-sect button{border:none;background:transparent;color:var(--info);display:flex;align-items:center}
.agx2-sect svg{width:16px;height:16px}

/* agentic feed rows (inline card + drawer) */
.agx2-feeditem{border-bottom:1px solid var(--border)}
.agx2-feeditem:last-of-type{border-bottom:none}
.agx2-feedrow{display:flex;align-items:center;gap:10px;width:100%;border:none;background:transparent;text-align:left;
  padding:13px 4px;font-family:inherit;font-size:13.5px;color:var(--foreground);transition:.15s;border-radius:var(--r-sm)}
.agx2-feedrow:hover{background:var(--accent)}
.agx2-feedrow .lead{color:var(--info);font-weight:700;white-space:nowrap}
.agx2-feedrow .txt{flex:1;line-height:1.45}
.agx2-feedrow .pm{width:18px;flex:none;color:var(--muted-fg);text-align:center;font-size:16px;font-weight:600;line-height:1}
.agx2-feeddetail{padding:0 4px 13px;font-size:12.5px;color:var(--muted-fg);line-height:1.5}
.agx2-feeddetail a{color:var(--info);font-weight:var(--fw-med);text-decoration:none;cursor:pointer}
.agx2-feeddetail a:hover{text-decoration:underline}
.agx2-loadmore{display:flex;justify-content:center;padding-top:12px}

/* assessment agent: donut chart + legend */
.agx2-donutwrap{display:flex;align-items:center;gap:32px;flex-wrap:wrap;padding:12px 4px}
.agx2-donut{width:200px;height:200px;flex:none}
.agx2-donut circle{transition:stroke-dasharray .4s ease}
.agx2-donut .dv{font-size:30px;font-weight:var(--fw-med);fill:var(--foreground);font-family:inherit}
.agx2-donut .dl{font-size:11px;fill:var(--muted-fg);font-family:inherit}
.agx2-legend{display:flex;flex-direction:column;gap:10px;min-width:240px}
.lg-row{display:flex;align-items:center;gap:10px;font-size:13.5px}
.lg-dot{width:11px;height:11px;border-radius:3px;flex:none}
.lg-name{flex:1;color:var(--foreground);font-weight:var(--fw-med)}
.lg-val{font-weight:700;color:var(--foreground);min-width:24px;text-align:right}
.lg-pct{color:var(--muted-fg);font-size:12px;min-width:38px;text-align:right}

/* assessment violations table: horizontal scroll, footer, view-more pill */
.agx2-tscroll{overflow-x:auto;margin:8px 0 0}
.agx2-asmtable{min-width:860px;table-layout:fixed}
.agx2-asmtable td{vertical-align:top;overflow-wrap:anywhere}
.agx-table.agx2-asmtable th{white-space:normal;vertical-align:top}
.agx2-asmtable th:nth-child(1){width:9%}.agx2-asmtable th:nth-child(2){width:14%}
.agx2-asmtable th:nth-child(3){width:13%}.agx2-asmtable th:nth-child(4){width:26%}
.agx2-asmtable th:nth-child(5){width:10%}.agx2-asmtable th:nth-child(6){width:9%}
.agx2-asmtable th:nth-child(7){width:11%}.agx2-asmtable th:nth-child(8){width:8%}
.agx2-asmtable td.pol{line-height:1.5}
.agx2-vm{border:none;background:var(--muted);color:var(--foreground);border-radius:9999px;padding:3px 12px;
  font-family:inherit;font-size:11.5px;font-weight:var(--fw-med);white-space:nowrap;transition:.15s}
.agx2-vm:hover{background:var(--accent);color:var(--info)}
body.dark .agx2-vm{background:#1E2A44;color:#E6EAF2}
.agx2-tfoot{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding:12px 2px 2px;font-size:13px;color:var(--foreground)}
.agx2-tfoot .tot{font-weight:var(--fw-med)}
.agx2-tfoot .pgr{display:flex;align-items:center;gap:14px}
.agx2-tfoot .ipp{color:var(--foreground);cursor:pointer}
.agx2-tfoot .rng{color:var(--foreground)}
.pgbtn{width:28px;height:28px;border:none;background:transparent;border-radius:6px;color:var(--foreground);
  font-size:16px;line-height:1;display:grid;place-items:center;font-family:inherit;transition:.15s}
.pgbtn:hover:not(:disabled){background:var(--accent);color:var(--info)}
.pgbtn:disabled{color:var(--switch-bg);cursor:default}

/* per-message action icons (copy / thumbs / regenerate) */
.agx2-msgacts{display:flex;gap:6px;margin-top:12px}
.agx2-msgacts button{width:28px;height:28px;border:none;background:transparent;border-radius:7px;
  color:var(--muted-fg);display:grid;place-items:center;transition:.15s}
.agx2-msgacts button:hover{background:var(--accent);color:var(--info)}
.agx2-msgacts svg{width:15px;height:15px}

/* insight bar charts */
.agx2-chartcard{border:1px solid var(--glass-border);border-radius:var(--r);background:rgba(255,255,255,.6);
  padding:14px 14px 8px;margin-bottom:14px}
body.dark .agx2-chartcard{background:#1B2336;border-color:#2A3550}
.agx2-chartcard .ct{font-size:13px;font-weight:var(--fw-med);color:var(--foreground);margin-bottom:4px}
.agx2-chart{width:100%;height:auto;display:block}
.agx2-chart .gl{stroke:var(--border);stroke-width:1}
.agx2-chart .ax{font-size:10px;fill:var(--muted-fg);font-family:inherit}
.agx2-chart .vl{font-size:10px;font-weight:700;fill:var(--foreground);font-family:inherit}
.agx2-chart rect{transition:opacity .15s}
.agx2-chart rect:hover{opacity:1}

.agx2-chart .axl{font-size:10.5px;font-weight:700;fill:var(--muted-fg);font-family:inherit;letter-spacing:.04em}

/* KPI tiles with icon */
.kpi--ico{display:flex;align-items:center;gap:12px}
.kico{width:38px;height:38px;border-radius:10px;background:var(--info-l);color:var(--info);
  display:grid;place-items:center;flex:none}
body.dark .kico{background:#15233E}
.kinfo{display:inline-grid;place-items:center;width:14px;height:14px;color:var(--info);vertical-align:-2px;cursor:help}
.kinfo svg{width:13px;height:13px}

/* Agentic Feed title row + expand */
.agx2-feedtitle{display:flex;align-items:center;justify-content:space-between;
  font-size:16px;font-weight:var(--fw-med);color:var(--foreground);padding:6px 2px 10px;
  border-bottom:1px solid var(--border)}
.agx2-expand{width:30px;height:30px;border:none;background:transparent;border-radius:7px;color:var(--info);
  display:grid;place-items:center;transition:.15s}
.agx2-expand:hover{background:var(--accent)}
.agx2-expand svg{width:16px;height:16px}

/* feed row leading icon */
.agx2-feedrow .fic{width:28px;height:28px;border-radius:8px;background:var(--info-l);color:var(--info);
  display:grid;place-items:center;flex:none}
body.dark .agx2-feedrow .fic{background:#15233E}

/* framework chips in the assessments table */
.agx2-fw{display:inline-block;background:var(--info-l);color:var(--info);border-radius:9999px;
  padding:3px 10px;font-size:11.5px;font-weight:var(--fw-med);margin:2px 2px 2px 0;white-space:nowrap}
body.dark .agx2-fw{background:#15233E}

/* horizontal contribution bars */
.agx2-bars{display:flex;flex-direction:column;gap:12px;padding:10px 2px 4px;max-width:560px}
.agx2-barrow{display:flex;align-items:center;gap:12px;font-size:13px}
.agx2-barrow .bl{flex:none;width:190px;font-weight:var(--fw-med);color:var(--foreground);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agx2-barrow .bt{flex:1;height:12px;border-radius:9999px;background:var(--muted);overflow:hidden}
.agx2-barrow .bt i{display:block;height:100%;border-radius:9999px;transition:width .4s ease}
.agx2-barrow .bv{flex:none;width:22px;text-align:right;font-weight:700;color:var(--foreground)}
.agx2-barrow .bp{flex:none;width:36px;text-align:right;color:var(--muted-fg);font-size:12px}
body.dark .agx2-barrow .bt{background:#1E2A44}

/* AppSecOps prompt library — card grid (template + meta tag + copy icon) */
.agx2-promptlib{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px;width:100%;margin-top:14px}
.agx2-pcard{background:rgba(255,255,255,.7);border:1px solid var(--glass-border);border-radius:14px;
  padding:16px 16px 12px;display:flex;flex-direction:column;gap:14px;text-align:left;cursor:pointer;
  font-family:inherit;min-height:128px;transition:.15s;box-shadow:0 2px 8px rgba(23,43,77,.04)}
.agx2-pcard:hover{background:#fff;transform:translateY(-2px);box-shadow:var(--sh-md);border-color:#C9DCF3}
body.dark .agx2-pcard{background:#1B2336;border-color:#2A3550}
body.dark .agx2-pcard:hover{background:#1E2A44}
.agx2-pcard .pt{font-size:13px;color:var(--foreground);line-height:1.55;flex:1}
.agx2-pcard .pf{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted-fg);font-weight:var(--fw-med)}
.agx2-pcard .pcopy{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--muted-fg);transition:.15s}
.agx2-pcard .pcopy:hover{background:var(--accent);color:var(--info)}
.agx2-pcard .pcopy svg{width:15px;height:15px}
.agx2-libwrap{width:100%;max-width:760px;max-height:300px;overflow-y:auto;margin-bottom:12px;padding-right:4px}
.agx2-libwrap::-webkit-scrollbar{width:8px}.agx2-libwrap::-webkit-scrollbar-thumb{background:rgba(0,0,0,.12);border-radius:8px}
.agx2-libwrap .agx2-promptlib{margin-top:0;grid-template-columns:repeat(auto-fill,minmax(215px,1fr))}
@media(prefers-reduced-motion:no-preference){
  body.anim .agx2-promptlib .agx2-pcard{animation:agxKpiIn .35s cubic-bezier(.16,1,.3,1) both}
  body.anim .agx2-promptlib .agx2-pcard:nth-child(n+2){animation-delay:calc((var(--n,0))*0ms + .04s)}
  body.anim .agx2-promptlib .agx2-pcard:nth-child(2){animation-delay:.04s}
  body.anim .agx2-promptlib .agx2-pcard:nth-child(3){animation-delay:.08s}
  body.anim .agx2-promptlib .agx2-pcard:nth-child(4){animation-delay:.12s}
  body.anim .agx2-promptlib .agx2-pcard:nth-child(n+5){animation-delay:.16s}
}

/* compact, scrollable "more prompts" containers (12 extras stay tidy) */
.agx2-morewrap{max-height:236px;overflow-y:auto;margin-top:12px;padding-right:6px;
  border:1px solid var(--glass-border);border-radius:var(--r-xl);padding:4px 10px 10px;background:rgba(255,255,255,.35)}
body.dark .agx2-morewrap{background:#161D2E;border-color:#2A3550}
.agx2-morewrap::-webkit-scrollbar{width:8px}
.agx2-morewrap::-webkit-scrollbar-thumb{background:rgba(0,0,0,.14);border-radius:8px}
body.dark .agx2-morewrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16)}
.predef--sm{padding:10px 14px;margin-top:8px;border-radius:12px;gap:12px}
.predef--sm .pico{width:24px;height:24px;border-radius:6px}
.predef--sm .pico svg{width:13px;height:13px}
.predef--sm .ptext{font-size:13px}
.agx2-chipscroll{display:flex;flex-wrap:wrap;gap:8px;width:100%;max-height:84px;overflow-y:auto;
  padding:6px 6px 6px 2px;margin-top:-2px}
.agx2-chipscroll::-webkit-scrollbar{width:8px}
.agx2-chipscroll::-webkit-scrollbar-thumb{background:rgba(0,0,0,.14);border-radius:8px}
body.dark .agx2-chipscroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16)}

/* result tables & badges inside agent bubbles (kept from v1, CoWork-toned) */
.agx-table{width:100%;border-collapse:collapse;border:1px solid var(--border);margin:8px 0 2px;background:rgba(255,255,255,.5)}
.agx-table th{background:var(--muted);font-size:12px;font-weight:700;color:var(--muted-fg);text-align:left;
  padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
.agx-table td{font-size:12.5px;color:var(--foreground);padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.agx-table tr:last-child td{border-bottom:none}
.agx-table td.b{font-weight:700}
body.dark .agx-table{background:transparent}
.agx-badge{display:inline-flex;align-items:center;padding:2px 10px;border-radius:9999px;font-size:11px;font-weight:700}
.agx-badge.crit{background:var(--error-l);color:var(--error)}
.agx-badge.high{background:#FFF3E8;color:#C46A1E}
.agx-badge.med{background:var(--warning-l);color:#8a7400}
.agx-badge.kev{background:#FCE8F1;color:#C2255C;margin-left:6px}
.agx-score{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--foreground)}
.agx-score i{width:8px;height:8px;border-radius:50%;background:var(--error);display:inline-block;font-style:normal}
.agx-kpis{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 10px}
.agx-kpi{flex:1 1 130px;border:1px solid var(--glass-border);border-radius:var(--r);padding:12px 14px;background:rgba(255,255,255,.6)}
body.dark .agx-kpi{background:#1B2336;border-color:#2A3550}
.agx-kpi .v{font-size:18px;font-weight:var(--fw-med);color:var(--foreground)}
.agx-kpi .l{font-size:11px;color:var(--muted-fg);font-weight:var(--fw-med)}
.agx-kpi.hl{border-color:var(--info);background:var(--info-l)}
.agx-kpi.hl .v{color:var(--info)}

/* ===== Governance · Account Governance · Cloud Account ===== */
.gov-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
.gov-head h1{font-size:26px;font-weight:var(--fw-med);letter-spacing:-.02em;color:var(--foreground)}
.gov-head .gsub{color:var(--muted-fg);font-size:14px;margin-top:2px}
.gov-onboard{height:44px;padding:0 22px;border-radius:10px;background:var(--info);color:#fff;border:none;display:inline-flex;align-items:center;gap:9px;font-weight:700;font-size:14px;flex:none;transition:.15s}
.gov-onboard:hover{filter:brightness(1.08)}
.gov-onboard svg{width:18px;height:18px}

/* ===== Onboarding landing screen ===== */
.onb-layout{display:grid;grid-template-columns:248px 1fr;gap:24px;align-items:start}
.onb-side{border:1px solid var(--glass-border);border-radius:var(--r-2xl);background:var(--glass-bg);box-shadow:var(--glass-shadow);padding:18px 14px}
.onb-side h3{font-size:15px;font-weight:700;color:var(--foreground);padding:6px 10px 12px}
.onb-cat{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:11px 12px;border:none;background:transparent;border-radius:9px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:500;color:var(--foreground);text-align:left;transition:.12s}
.onb-cat:hover{background:var(--accent)}
.onb-cat.on{background:var(--info-l);color:var(--info);font-weight:700}
.onb-divider{height:1px;background:var(--border);margin:14px 6px}
.onb-side h4{font-size:13.5px;font-weight:700;color:var(--foreground);padding:0 10px 10px}
.onb-doc{display:flex;align-items:center;gap:6px;padding:4px 10px;font-size:13px;color:var(--info);font-weight:600;cursor:pointer}
.onb-doc:hover{text-decoration:underline}
.onb-doc svg{width:13px;height:13px}
.onb-main{border:1px solid var(--glass-border);border-radius:var(--r-2xl);background:var(--glass-bg);box-shadow:var(--glass-shadow);padding:22px 24px}
.onb-main h2{font-size:18px;font-weight:700;color:var(--foreground)}
.onb-main .onb-lede{color:var(--muted-fg);font-size:13.5px;margin:4px 0 18px}
.onb-section-h{font-size:13.5px;font-weight:700;color:var(--foreground);margin:18px 0 12px;padding-top:18px;border-top:1px solid var(--border)}
.onb-section-h:first-of-type{border-top:none;padding-top:0;margin-top:0}
.onb-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.onb-card{position:relative;border:1px solid var(--border);border-radius:14px;background:var(--background);padding:18px;cursor:pointer;transition:border-color .15s, box-shadow .15s;display:flex;flex-direction:column;gap:10px;min-height:150px}
.onb-card:hover{border-color:var(--info);box-shadow:0 4px 16px rgba(0,118,225,.12)}
.onb-card .onb-logo{height:36px;display:flex;align-items:center}
.onb-card .onb-logo svg{height:34px;width:auto}
.onb-card .onb-logo .onb-textlogo{font-size:15px;font-weight:800;letter-spacing:-.02em;color:var(--foreground)}
.onb-card .onb-name{font-size:15px;font-weight:700;color:var(--foreground);line-height:1.3}
.onb-card .onb-desc{font-size:12.5px;color:var(--muted-fg);line-height:1.5}
/* tinted tile logo */
.onb-tile{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;font-size:14px;font-weight:800;line-height:1}
/* hover: dim the card content, overlay a centered Onboard button */
.onb-card .onb-logo,.onb-card .onb-name,.onb-card .onb-desc{transition:opacity .15s}
.onb-card:hover .onb-logo,.onb-card:hover .onb-name,.onb-card:hover .onb-desc{opacity:.28}
.onb-cta{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:32px;padding:0 22px;border:none;border-radius:8px;background:var(--info);color:#fff;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;opacity:0;transition:opacity .15s;pointer-events:none;box-shadow:0 6px 18px rgba(0,118,225,.32);white-space:nowrap}
.onb-card:hover .onb-cta{opacity:1;pointer-events:auto}
.onb-cta:hover{filter:brightness(1.08)}
/* custom (dashed) cards */
.onb-grid--custom{grid-template-columns:repeat(4,1fr)}
.onb-card--custom{border:1.5px dashed var(--info);background:transparent;align-items:flex-start;justify-content:center;min-height:120px}
.onb-card--custom:hover{box-shadow:none;background:var(--info-l)}
.onb-custom-label{color:var(--info);font-weight:700;font-size:15px;line-height:1.3}
@media(max-width:1100px){.onb-grid,.onb-grid--custom{grid-template-columns:repeat(2,1fr)}.onb-layout{grid-template-columns:1fr}}

/* ===== Onboarding wizard (AWS etc.) ===== */
.wiz-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px;position:sticky;top:0;z-index:50;background:#F5F6FB;padding:16px 0;border-bottom:1px solid var(--border)}
body.dark .wiz-head{background:#0E1525}
.wiz-head h1{font-size:26px;font-weight:var(--fw-med);letter-spacing:-.02em;color:var(--foreground)}
.wiz-head .wsub{color:var(--muted-fg);font-size:14px;margin-top:3px}
.wiz-actions{display:flex;gap:12px;flex:none}
.wiz-btn{height:44px;padding:0 22px;border-radius:10px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;border:1.5px solid transparent;transition:.15s}
.wiz-btn.ghost{background:#fff;border-color:var(--info);color:var(--info)}
.wiz-btn.ghost:hover{background:var(--info-l)}
.wiz-btn.primary{background:var(--info);color:#fff}
.wiz-btn.primary:hover{filter:brightness(1.08)}
.wiz-btn:disabled{background:var(--muted);color:#9AA4B2;cursor:not-allowed;border-color:transparent;filter:none}
body.dark .wiz-btn.ghost{background:#161E30}
.wiz-layout{display:grid;grid-template-columns:280px 1fr;gap:28px;align-items:start}
/* step rail */
.wiz-rail{display:flex;flex-direction:column;position:relative}
.wiz-step{display:flex;align-items:flex-start;gap:14px;padding:16px 18px;border-radius:12px;position:relative;z-index:1}
.wiz-step.active{background:var(--info-l)}
.wiz-step .wn{width:30px;height:30px;border-radius:50%;border:2px solid var(--switch-bg);color:var(--muted-fg);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;background:var(--background);z-index:1}
.wiz-step.active .wn{border-color:var(--info);color:var(--info)}
.wiz-step.done .wn{background:var(--info);border-color:var(--info);color:#fff}
.wiz-step .wl{font-size:14.5px;font-weight:600;color:var(--foreground);padding-top:4px;line-height:1.3}
.wiz-step.todo .wl{color:var(--muted-fg)}
.wiz-step .wn svg{width:15px;height:15px}
/* connector line between steps */
.wiz-step::before{content:"";position:absolute;left:33px;top:46px;bottom:-16px;width:2px;background:var(--border);z-index:0}
.wiz-step:last-child::before{display:none}
.wiz-step.done::before{background:var(--info)}
/* main panel */
.wiz-main{min-width:0}
.wiz-main h2{font-size:20px;font-weight:700;color:var(--foreground)}
.wiz-main .wlede{color:var(--muted-fg);font-size:14px;margin:4px 0 20px;line-height:1.5}
.wiz-card{border:1px solid var(--glass-border);border-radius:var(--r-2xl);background:var(--glass-bg);box-shadow:var(--glass-shadow);padding:22px 24px;margin-bottom:20px}
.wiz-card-h{font-size:15px;font-weight:700;color:var(--foreground);margin-bottom:14px}
/* selectable option cards (radio tiles) */
.wopt-row{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.wopt{position:relative;border:1.5px solid var(--border);border-radius:12px;padding:18px 20px;cursor:pointer;transition:.15s;background:var(--background)}
.wopt:hover{border-color:var(--info)}
.wopt.sel{border-color:var(--info);box-shadow:0 0 0 1px var(--info)}
.wopt h4{font-size:16px;font-weight:700;color:var(--foreground);margin-bottom:8px;padding-right:36px}
.wopt p{font-size:13px;color:var(--muted-fg);line-height:1.5;padding-right:36px}
.wopt .wradio{position:absolute;top:20px;right:20px;width:22px;height:22px;border-radius:50%;border:2px solid var(--switch-bg);flex:none;display:grid;place-items:center}
.wopt.sel .wradio{border-color:var(--info)}
.wopt.sel .wradio::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--info)}
.wopt .wbadge{position:absolute;right:0;bottom:0;background:var(--info-l);color:var(--info);font-size:12px;font-weight:700;padding:5px 12px;border-radius:12px 0 12px 0}
.wopt--sm{max-width:300px}
.wopt--sm h4{margin-bottom:2px}.wopt--sm p{font-size:12.5px}
/* product checklist */
.wsel-all{display:flex;align-items:center;gap:12px;padding:6px 2px 14px;font-size:14px;font-weight:600;color:var(--foreground)}
.wprod{display:flex;align-items:center;gap:14px;border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:12px;cursor:pointer;transition:.15s}
.wprod:hover{border-color:var(--info)}
.wcheck{width:20px;height:20px;border:2px solid var(--switch-bg);border-radius:5px;flex:none;display:grid;place-items:center;cursor:pointer;background:var(--background)}
.wcheck.on{background:var(--info);border-color:var(--info)}
.wcheck.on::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translateY(-1px)}
.wprod .wpico{width:34px;height:34px;flex:none;display:grid;place-items:center;color:var(--info)}
.wprod .wpico svg{width:26px;height:26px}
.wprod .wpname{font-size:15px;font-weight:700;color:var(--foreground)}
.wprod .wpsub{font-size:12.5px;color:var(--muted-fg);margin-top:1px}
/* form fields */
.wfield{margin-bottom:18px}
.wfield label{display:block;font-size:13px;color:var(--muted-fg);margin-bottom:7px;font-weight:500}
.wfield label .req{color:var(--error)}
.wfield input{width:100%;height:48px;padding:0 16px;border:1px solid var(--border);border-radius:10px;background:var(--input-bg);font-family:inherit;font-size:14px;color:var(--foreground);outline:none}
.wfield input:focus{border-color:var(--info)}
.wfield input.ro{background:var(--secondary);color:var(--muted-fg);letter-spacing:2px}
.wfield .whint{font-size:12px;color:var(--muted-fg);margin-top:6px}
.wradio-inline{display:flex;align-items:center;gap:28px;margin-top:4px}
.wradio-inline label{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:14px;color:var(--foreground);font-weight:500;margin:0}
.wri{width:20px;height:20px;border-radius:50%;border:2px solid var(--switch-bg);display:grid;place-items:center;flex:none}
.wri.on{border-color:var(--info)}.wri.on::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--info)}
/* validation banners */
.wbanner{display:flex;align-items:center;gap:14px;border:1px solid var(--glass-border);border-radius:var(--r-2xl);background:var(--glass-bg);box-shadow:var(--glass-shadow);padding:16px 20px;margin-bottom:20px}
.wbanner .wbico{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;flex:none}
.wbanner.err .wbico{background:#E6147F}.wbanner.ok .wbico{background:var(--success)}
.wbanner .wbico svg{width:22px;height:22px;color:#fff}
.wbanner.err .wbtxt{color:#C4185C;font-weight:700;font-size:15px}
.wbanner.ok .wbtxt{color:var(--success);font-weight:700;font-size:15px}
.wbanner .wlog{margin-left:auto;color:var(--info);font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap;text-decoration:underline}
/* tags */
.wtag-wrap{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:16px}
.wtag{background:#46505F;color:#fff;font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:9999px;white-space:nowrap}
.wtagged-row{display:grid;grid-template-columns:1fr 1fr auto;gap:14px;align-items:end}
.wval-ok{display:inline-flex;align-items:center;gap:7px;color:var(--success);font-size:13.5px;font-weight:700;margin:10px 0 14px}
.wval-ok svg{width:18px;height:18px}
.wsel{width:100%;height:48px;padding:0 16px;border:1px solid var(--border);border-radius:10px;background:var(--input-bg);font-family:inherit;font-size:14px;color:var(--foreground);display:flex;align-items:center;justify-content:space-between;cursor:pointer}
/* region multi-select */
.wms{position:relative}
.wms-trigger{width:100%;min-height:48px;padding:7px 14px;border:1px solid var(--border);border-radius:10px;background:var(--input-bg);font-family:inherit;font-size:14px;color:var(--foreground);display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer}
.wms.open .wms-trigger{border-color:var(--info);box-shadow:0 0 0 1px var(--info)}
.wms-trigger svg{width:18px;height:18px;color:var(--muted-fg);flex:none;transition:transform .15s}
.wms.open .wms-trigger svg{transform:rotate(180deg)}
.wms-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;flex:1;min-width:0}
.wms-chip{display:inline-flex;align-items:center;gap:6px;background:var(--info-l);color:var(--info);font-size:12.5px;font-weight:600;padding:4px 8px 4px 10px;border-radius:7px}
.wms-chip b{font-weight:700}
.wms-chip .x{cursor:pointer;display:inline-flex;width:14px;height:14px;align-items:center;justify-content:center;border-radius:3px}
.wms-chip .x:hover{background:rgba(0,118,225,.18)}
.wms-ph{color:var(--muted-fg)}
.wms-panel{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;background:var(--background);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.16);padding:8px;max-height:320px;overflow:auto}
body.dark .wms-panel{background:#161E30}
.wms-opt{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--foreground)}
.wms-opt:hover{background:var(--accent)}
.wms-opt .wcheck{width:18px;height:18px}
.wms-opt.allrow{border-bottom:1px solid var(--border);border-radius:0;margin-bottom:4px;font-weight:700}
.wsel svg{width:18px;height:18px;color:var(--muted-fg)}
.wpolicy{display:flex;align-items:flex-start;gap:14px}
.wpolicy .wpx{font-size:15px;font-weight:700;color:var(--foreground)}
.wpolicy .wpd{font-size:13.5px;color:var(--muted-fg);margin-top:3px}
.wpolicy a{color:var(--info);font-weight:600}
.wlink-btn{height:40px;padding:0 16px;border:1.5px solid var(--info);border-radius:9px;background:#fff;color:var(--info);font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
.wlink-btn:hover{background:var(--info-l)}
.wlink-btn.muted{border-color:var(--border);color:var(--muted-fg);cursor:not-allowed}
@media(max-width:1100px){.wiz-layout{grid-template-columns:1fr}.wopt-row{grid-template-columns:1fr}}

/* onboarding status dialog */
.wiz-modal-scrim{position:fixed;inset:0;background:rgba(15,23,42,.5);display:grid;place-items:center;z-index:200}
.wiz-modal{width:min(460px,92vw);background:var(--background);border-radius:18px;box-shadow:0 24px 64px rgba(0,0,0,.32);padding:30px 28px;text-align:center}
.wiz-modal .wm-ico{width:64px;height:64px;border-radius:50%;background:var(--success-l);color:var(--success);display:grid;place-items:center;margin:0 auto 18px}
.wiz-modal .wm-ico svg{width:34px;height:34px}
.wiz-modal h3{font-size:19px;font-weight:700;color:var(--foreground);margin-bottom:8px}
.wiz-modal p{font-size:14px;color:var(--muted-fg);line-height:1.55;margin-bottom:20px}
.wiz-modal .wm-prog{height:8px;border-radius:9999px;background:var(--muted);overflow:hidden;margin-bottom:8px}
.wiz-modal .wm-prog i{display:block;height:100%;background:var(--success);border-radius:9999px;width:0;transition:width .9s ease}
.wiz-modal .wm-prog-cap{font-size:12.5px;color:var(--muted-fg);margin-bottom:22px}
.wiz-modal .wiz-btn{width:100%;justify-content:center}
/* view-log dialog */
.wiz-log{width:min(620px,94vw);background:var(--background);border-radius:16px;box-shadow:0 24px 64px rgba(0,0,0,.32);overflow:hidden;text-align:left}
.wiz-log-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.wiz-log-h h3{font-size:16px;font-weight:700;color:var(--foreground)}
.wiz-log-h .x{cursor:pointer;color:var(--muted-fg);width:30px;height:30px;display:grid;place-items:center;border-radius:8px}
.wiz-log-h .x:hover{background:var(--accent)}
.wiz-log pre{margin:0;padding:18px 20px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:#C4185C;background:var(--secondary);white-space:pre-wrap;max-height:300px;overflow:auto}

/* provider tabs */
.prov-tabs{display:flex;gap:34px;border-bottom:1px solid var(--border);margin-bottom:22px}
.prov-tab{display:flex;align-items:center;gap:9px;padding:6px 2px 14px;background:none;border:none;cursor:pointer;
  font-size:16px;font-weight:600;color:var(--muted-fg);position:relative;font-family:inherit}
.prov-tab .pti{width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex:none}
.prov-tab.on{color:var(--info)}
.prov-tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--info)}
body.dark .prov-tab.on{color:#60A5FA}

/* summary cards row — flex with horizontal scroll fallback when cards overflow */
.gsum-scroll{overflow-x:auto;overflow-y:hidden;margin:0 -2px 22px;padding:2px 2px 6px;scrollbar-width:thin;scrollbar-color:#C8CDD5 transparent}
.gsum-scroll::-webkit-scrollbar{height:8px}
.gsum-scroll::-webkit-scrollbar-thumb{background:rgba(0,0,0,.16);border-radius:8px}
.gsum-row{display:flex;gap:22px;align-items:flex-start;min-width:min-content}
.gsum-card{flex:1 1 0;border:1px solid var(--glass-border);border-radius:var(--r-2xl);background:var(--glass-bg);padding:18px;box-shadow:var(--glass-shadow);display:flex;flex-direction:column}
/* a card that holds 2+ tabs needs more room than a single-type card */
.gsum-card:has(.gsum-tabs){min-width:380px}
.gsum-card:has(.gsum-single){min-width:300px;flex:1 1 0}
.gsum-card.is-active{border-color:var(--info);box-shadow:0 0 0 1px var(--info),var(--glass-shadow)}
.gsum-tabs{display:flex;gap:10px}
.gsum-tab{flex:1;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-radius:10px;
  background:var(--secondary);border:1px solid transparent;cursor:pointer;font-family:inherit;transition:.15s;min-width:0}
.gsum-tab .gst-l{font-size:13.5px;font-weight:600;color:var(--foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.gsum-tab .gst-v{font-size:20px;font-weight:800;color:var(--foreground);flex:none}
.gsum-tab.on{background:var(--info);border-color:var(--info)}
.gsum-tab.on .gst-l,.gsum-tab.on .gst-v{color:#fff}
.gsum-tab:not(.on):hover{background:var(--accent)}
body.dark .gsum-tab{background:#1B2336}
body.dark .gsum-tab.on{background:#3B82F6}
.gsum-single{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px;border-radius:10px;background:var(--secondary);cursor:pointer;border:1px solid transparent;transition:.15s}
.gsum-single .gst-l{font-size:13.5px;font-weight:600;color:var(--foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.gsum-single .gst-v{font-size:20px;font-weight:800;color:var(--foreground);flex:none}
.gsum-single:not(.on):hover{background:var(--accent)}
.gsum-single.on{background:var(--info);border-color:var(--info)}
.gsum-single.on .gst-l,.gsum-single.on .gst-v{color:#fff}
body.dark .gsum-single{background:#1B2336}
body.dark .gsum-single.on{background:#3B82F6}
.gsum-list{margin-top:14px;display:flex;flex-direction:column}
.gsum-li{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:18px;padding:13px 4px;border-top:1px dashed var(--border)}
.gsum-li:first-child{border-top:none}
.gsum-li .gli-label{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--foreground)}
.gsum-li .gli-ic{width:20px;height:20px;flex:none;display:flex;align-items:center;justify-content:center}
.gsum-li .gli-ic svg{width:18px;height:18px}
.gsum-li .gli-num{font-size:14px;font-weight:700;color:var(--foreground);text-align:right;min-width:42px}
.gsum-li .gli-act{font-size:13.5px;font-weight:700;color:var(--info);cursor:pointer;text-align:right;min-width:64px}
.gsum-li .gli-act:hover{text-decoration:underline}
.tone-danger{color:var(--error)}.tone-warn{color:#C46A1E}.tone-ok{color:var(--success)}
.gli-ic.tone-danger{color:#E6147F}.gli-ic.tone-warn{color:#C46A1E}.gli-ic.tone-ok{color:var(--success)}.gli-ic.tone-info{color:var(--info)}

/* data table panel */
.gtable-panel{border:1px solid var(--glass-border);border-radius:var(--r-2xl);background:var(--glass-bg);box-shadow:var(--glass-shadow);padding:20px 20px 0;overflow:hidden}
.gtable-title{font-size:18px;font-weight:700;color:var(--foreground);margin-bottom:16px}
.gtable-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.gsearch{flex:1;display:flex;align-items:center;gap:10px;height:46px;padding:0 16px;border:1px solid var(--border);border-radius:10px;background:var(--input-bg)}
.gsearch input{flex:1;border:none;background:transparent;outline:none;font-family:inherit;font-size:14px;color:var(--foreground)}
.gsearch svg{width:18px;height:18px;color:var(--muted-fg);flex:none}
.gbtn-split{display:flex;align-items:center;height:46px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--muted-fg);font-weight:600;font-size:14px;overflow:hidden}
.gbtn-split .gbs-main{display:flex;align-items:center;gap:8px;padding:0 16px;background:none;border:none;font-family:inherit;color:inherit;cursor:not-allowed}
.gbtn-split .gbs-arrow{padding:0 12px;border-left:1px solid var(--border);height:100%;display:flex;align-items:center;cursor:pointer}
.gbtn-split svg{width:16px;height:16px}
body.dark .gbtn-split{background:#161E30}
.gselect{display:flex;align-items:center;gap:10px;height:46px;padding:0 16px;border:1px solid var(--border);border-radius:10px;background:#fff;font-size:14px;color:var(--foreground);font-weight:500;cursor:pointer}
.gselect svg{width:16px;height:16px;color:var(--muted-fg)}
body.dark .gselect{background:#161E30}
.gicobtn{width:46px;height:46px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--info);display:grid;place-items:center;cursor:pointer;flex:none}
.gicobtn:hover{background:var(--accent)}
.gicobtn svg{width:20px;height:20px}
body.dark .gicobtn{background:#161E30}

/* governance data table */
.gtable-scroll{overflow-x:auto;margin:0 -20px;padding:0 20px}
.gtable-scroll::-webkit-scrollbar{height:8px}.gtable-scroll::-webkit-scrollbar-thumb{background:rgba(0,0,0,.14);border-radius:8px}
.gtable{width:100%;border-collapse:collapse;min-width:1100px}
.gtable th{font-size:12.5px;font-weight:700;color:var(--muted-fg);text-align:left;padding:14px 16px;white-space:nowrap;border-bottom:1px solid var(--border)}
.gtable th .sortcaret{margin-left:6px;opacity:.7}
.gtable td{font-size:13px;color:var(--foreground);padding:14px 16px;white-space:nowrap;border-bottom:1px solid var(--border);vertical-align:middle}
.gtable tbody tr:hover{background:var(--accent)}
.gtable .lnk{color:var(--info);font-weight:600;cursor:pointer}
.gtable .lnk:hover{text-decoration:underline}
.gcheck{width:18px;height:18px;border:1.6px solid var(--switch-bg);border-radius:4px;display:inline-block;vertical-align:middle;cursor:pointer;background:#fff;flex:none}
body.dark .gcheck{background:#161E30}
.gstatus{display:inline-flex;align-items:center;padding:4px 12px;border-radius:9999px;font-size:11.5px;font-weight:700}
.gstatus.onboarded{background:var(--success-l);color:var(--success)}
.gstatus.inprog{background:var(--warning-l);color:#8a7400}
.gstatus.deact{background:var(--error-l);color:var(--error)}
.gstatus.active{background:var(--success-l);color:var(--success)}
/* subscription count badge */
.gcount{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:26px;padding:0 8px;border:1px solid var(--info);border-radius:8px;color:var(--info);font-weight:700;font-size:12.5px}
.gbtn-onboard{padding:6px 18px;border:1.5px solid var(--info);border-radius:8px;background:transparent;color:var(--info);font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit}
.gbtn-onboard:hover{background:var(--info);color:#fff}
.gprog{min-width:150px}
.gprog .gp-top{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12.5px;font-weight:600;color:var(--foreground);margin-bottom:5px}
.gprog .gp-view{display:inline-flex;align-items:center;gap:2px;color:var(--info);font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap}
.gprog .gp-view:hover{text-decoration:underline}
.gprog .gp-view svg{width:13px;height:13px}
.gprog .gp-bar{height:6px;border-radius:9999px;background:var(--muted);overflow:hidden}
.gprog .gp-bar i{display:block;height:100%;border-radius:9999px;background:var(--success)}
.gprog .gp-cap{font-size:11.5px;font-weight:600;margin-top:4px}
.gprog .gp-cap.ok{color:var(--success)}.gprog .gp-cap.na{color:var(--muted-fg)}.gprog .gp-cap.prog{color:var(--muted-fg)}
.gcred{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.gcred.valid{color:var(--success)}.gcred.invalid{color:var(--error)}
.gcred i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
/* EA credential pill + expiry note */
.gcred-wrap{display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.gcred-pill{display:inline-flex;align-items:center;padding:3px 12px;border-radius:9999px;font-size:11.5px;font-weight:700}
.gcred-pill.valid{background:var(--success-l);color:var(--success)}
.gcred-pill.degraded{background:var(--warning-l);color:#8a7400}
.gcred-pill.invalid{background:var(--error-l);color:var(--error)}
.gcred-note{font-size:11px;font-weight:600;color:var(--error)}
/* product list chips */
.gprod{display:inline-block;padding:3px 9px;border-radius:6px;background:var(--info-l);color:var(--info);font-size:11px;font-weight:700;margin:1px 0;white-space:nowrap}
body.dark .gprod{background:#1E2A44;color:#60A5FA}
.gkebab{width:30px;height:30px;border-radius:7px;border:none;background:transparent;color:var(--muted-fg);display:grid;place-items:center;cursor:pointer}
.gkebab:hover,.gkebab.open{background:var(--accent);color:var(--info)}
.gkebab svg{width:18px;height:18px}
.gtag-na{color:var(--muted-fg)}

/* Dashboard Action Menu — OSCAR --dam-* tokens (floating popover) */
.dam-scrim{position:fixed;inset:0;z-index:998}
.dam-menu{
  --dam-bg:#FFFFFF; --dam-radius:8px; --dam-shadow:0px 4px 21px 0px rgba(0,0,0,0.08);
  --dam-padding:8px; --dam-gap:8px; --dam-min-width:160px;
  --dam-item-label-color:#495974; --dam-item-icon-color:#0076E1;
  position:fixed;z-index:999;background:var(--dam-bg);border-radius:var(--dam-radius);
  box-shadow:var(--dam-shadow);padding:var(--dam-padding);display:flex;flex-direction:column;
  align-items:flex-start;gap:4px;min-width:var(--dam-min-width);width:max-content;
  font-family:'Nunito Sans',var(--font)}
.dam-item{display:flex;align-items:center;gap:8px;width:100%;padding:8px;border-radius:4px;
  border:none;background:transparent;cursor:pointer;font-family:inherit;
  font-size:13px;font-weight:600;color:var(--dam-item-label-color);white-space:nowrap;
  transition:background .12s ease,color .12s ease;text-align:left}
.dam-item svg{width:16px;height:16px;flex:none;color:var(--dam-item-icon-color)}
.dam-item:hover{background:#EBF5FF;color:#0076E1}
.dam-item:hover svg{color:#0076E1}
.dam-item.destructive{color:#F55826}
.dam-item.destructive svg{color:#F55826}
.dam-item.destructive:hover{background:#FEEEE9;color:#F55826}
.dam-divider{height:1px;width:100%;background:#E1E4E9;margin:4px 0}
.dam-empty{padding:8px 10px;font-size:12.5px;color:#8893A6;font-style:italic;white-space:nowrap}
body.dark .dam-menu{--dam-bg:#161E30;--dam-item-label-color:#C7D0DE;box-shadow:0 8px 32px rgba(0,0,0,.55)}
body.dark .dam-item:hover{background:#1E2A44;color:#60A5FA}
body.dark .dam-divider{background:#2A3550}
/* Table Footer — OSCAR --tf-* tokens */
.gfoot{
  --tf-bg:#E1E4E9; --tf-color:#172B4D; --tf-padding:16px;
  --tf-radius-bl:16px; --tf-radius-br:16px;
  --tf-font-size:13px; --tf-font-weight:400; --tf-controls-gap:32px;
  --tf-ipp-gap:8px; --tf-nav-gap:8px; --tf-nav-icon-size:16px;
  display:flex;align-items:center;justify-content:space-between;gap:24px;
  margin:8px -20px 0;padding:var(--tf-padding);
  background:var(--tf-bg);border-radius:0 0 var(--tf-radius-bl) var(--tf-radius-br);
  font-size:var(--tf-font-size);font-weight:var(--tf-font-weight);color:var(--tf-color);line-height:normal}
.gfoot .tf-total{white-space:nowrap}
.gfoot .tf-controls{display:flex;align-items:center;gap:var(--tf-controls-gap)}
.gfoot .tf-ipp{display:flex;align-items:center;gap:var(--tf-ipp-gap);white-space:nowrap}
.gfoot .tf-ipp .tf-ipp-box{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-weight:400;color:var(--tf-color)}
.gfoot .tf-ipp svg{width:var(--tf-ipp-chevron-size,16px);height:var(--tf-ipp-chevron-size,16px)}
.gfoot .tf-range{white-space:nowrap}
.gfoot .tf-nav{display:flex;align-items:center;gap:var(--tf-nav-gap)}
.gfoot .tf-nav button{width:24px;height:24px;display:grid;place-items:center;border:none;background:transparent;color:var(--tf-color);cursor:pointer;border-radius:4px}
.gfoot .tf-nav button:hover:not(:disabled){background:rgba(23,43,77,.08)}
.gfoot .tf-nav button:disabled{opacity:.35;cursor:default}
.gfoot .tf-nav svg{width:var(--tf-nav-icon-size);height:var(--tf-nav-icon-size)}
body.dark .gfoot{--tf-bg:#1B2336;--tf-color:#E6EAF2}
body.dark .gfoot .tf-nav button:hover:not(:disabled){background:rgba(255,255,255,.08)}
.gam-tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted-fg)}
.gam-tag b{color:var(--foreground);font-weight:700}

/* placeholder screens (My Agents / Marketplace / MCP) */
.agx-placeholder{height:100%;display:flex;align-items:center;justify-content:center}
.agx-ph-card{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:var(--r-2xl);
  box-shadow:var(--glass-shadow);padding:48px 56px;max-width:520px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:8px}
.agx-ph-card .pic{width:64px;height:64px;border-radius:50%;background:var(--info-l);color:var(--info);
  display:grid;place-items:center;margin-bottom:8px}
.agx-ph-card .pic svg{width:28px;height:28px}
.agx-ph-card h2{font-size:18px;font-weight:var(--fw-med);color:var(--foreground)}
.agx-ph-card p{font-size:13px;color:var(--muted-fg);line-height:1.55;margin-bottom:14px}

/* ════════ Agent-screen animations (toggle: body.anim, motion-safe) ════════ */
.agx2-think{display:flex;align-items:center;gap:10px}
@media(prefers-reduced-motion:no-preference){
  /* message arrival — only the newest bubbles animate, directional like a real chat */
  body.anim .agx2-msgs > :last-child.agx2-urow{animation:agxFromRight .38s cubic-bezier(.16,1,.3,1) both}
  body.anim .agx2-msgs > :last-child.agx2-amsg,
  body.anim .agx2-msgs > :last-child.agx2-think{animation:agxFromLeft .4s cubic-bezier(.16,1,.3,1) both}
  @keyframes agxFromRight{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
  @keyframes agxFromLeft{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}

  /* suggestion chips cascade in after each answer */
  body.anim .agx2-chips .agx2-chip{animation:agxChipIn .32s cubic-bezier(.16,1,.3,1) both}
  body.anim .agx2-chips .agx2-chip:nth-child(2){animation-delay:.06s}
  body.anim .agx2-chips .agx2-chip:nth-child(3){animation-delay:.12s}
  body.anim .agx2-chips .agx2-chip:nth-child(4){animation-delay:.18s}
  body.anim .agx2-chips .agx2-chip:nth-child(5){animation-delay:.24s}
  body.anim .agx2-chips .agx2-chip:nth-child(6){animation-delay:.30s}
  @keyframes agxChipIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

  /* send pill pops when it becomes available */
  body.anim .sendbtn{animation:agxPopIn .18s cubic-bezier(.34,1.56,.64,1)}
  @keyframes agxPopIn{from{transform:scale(.82);opacity:.5}to{transform:scale(1);opacity:1}}

  /* donut sweeps into place */
  body.anim .agx2-donut{transform-origin:50% 50%;animation:agxDonutIn .6s cubic-bezier(.16,1,.3,1) both}
  @keyframes agxDonutIn{from{opacity:0;transform:rotate(-16deg) scale(.9)}to{opacity:1;transform:none}}

  /* insight bars grow from the axis, staggered; value labels follow */
  body.anim .agx2-chart rect{transform-box:fill-box;transform-origin:center bottom;
    animation:agxBarGrow .55s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i,0)*70ms)}
  @keyframes agxBarGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  body.anim .agx2-chart .vl{animation:agxFadeIn .3s both;animation-delay:calc(var(--i,0)*70ms + .35s)}
  @keyframes agxFadeIn{from{opacity:0}to{opacity:1}}

  /* KPI tiles settle in with a gentle stagger */
  body.anim .kpis .kpi{animation:agxKpiIn .4s cubic-bezier(.16,1,.3,1) both}
  body.anim .kpis .kpi:nth-child(2){animation-delay:.07s}
  body.anim .kpis .kpi:nth-child(3){animation-delay:.14s}
  body.anim .kpis .kpi:nth-child(4){animation-delay:.21s}
  @keyframes agxKpiIn{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}

  /* agentic feed detail unfolds */
  body.anim .agx2-feeddetail{animation:agxUnfold .25s ease both}
  @keyframes agxUnfold{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}

  /* violations table rows cascade on page change */
  body.anim .agx2-asmtable tbody tr{animation:agxRowIn .3s both;animation-delay:calc(var(--i,0)*50ms)}
  @keyframes agxRowIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}

  /* contribution bars sweep to width */
  body.anim .agx2-barrow .bt i{animation:agxSweep .6s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i,0)*90ms)}
  @keyframes agxSweep{from{width:0}}
}

    html += `<div class="step ${state}">
      <div class="num">${state==='done'?ic('i-check',16):(i+1)}</div>
      <div><div class="stitle">${s.t}</div>
      ${i===0&&selectedOutcome?`<div class="sdesc">${selectedOutcome}</div>`:''}
      ${showSubs?`<div class="sub">${s.subs.map(x=>`<span>${x}</span>`).join('')}</div>`:''}
      </div></div>`;
  });
  const labels={welcome:'Choose your outcome type…',prerequisites:'Checking prerequisites…',boundaries:'Define scope & exclusions…',deployment:'Supervisor agent active…',signals:'Analyzing signals…','signal-detail':'Analyzing signals…',dispatch:'Routing to teams…'};
  html += `<div class="foot"><div class="lbl">Overall Progress <b>${overall}%</b></div><div class="pbar"><i style="width:${overall}%${activeKey==='dispatch'?';background:var(--success)':''}"></i></div><div class="stat">${labels[activeKey]||''}</div></div>`;
  prog.innerHTML = html;
}

        or `single` (one type). The first type listed is the provider default. ---- */

  aws:[
    {tabs:[{key:'aws-mgmt',label:'Management Accounts'},{key:'aws-member',label:'Member Accounts'}]},
    {single:{key:'aws-individual',label:'Individual Member Accounts'}},
  ],

    {single:{key:'az-individual-sub',label:'Individual Subscriptions'}},

/* default account type for a provider (first type in its first card) */
function govDefaultType(provider){
  const card = GOV_PROVIDER_CONFIG[provider][0];
  return card.tabs ? card.tabs[0].key : card.single.key;
}
/* all type keys for a provider, flattened */
function govProviderTypes(provider){
  const keys=[];
  GOV_PROVIDER_CONFIG[provider].forEach(c=>{
    if(c.tabs) c.tabs.forEach(tb=>keys.push(tb.key)); else keys.push(c.single.key);
  });
  return keys;
}

/* Dynamic summary for a given account-type key — derived from its sample rows. */
function govComputeSummary(typeKey){
  const def = GOV_TYPES[typeKey];
  const rows = (def && def.rows) || [];
  const total = (def && def.total) || rows.length;
  const sample = rows.length || 1;
  const rawInvalid = rows.filter(r=>r.cred==='invalid').length;
  const rawDeact   = rows.filter(r=>r.cstat==='Deactivated').length;
  const rawActive  = rows.filter(r=>r.cstat==='Active').length;
  const scale = v => Math.round(v / sample * total);
  let invalid = scale(rawInvalid);
  let deact   = scale(rawDeact);
  let active  = Math.min(scale(rawActive), Math.max(0, total - deact));
  const m = {count: total, invalid, deact, active};
  if(def && def.cost){ m.cost = total>0 ? Math.round(active / total * 100) : 0; }
  return m;
}
/* GOV_SUMMARY[typeKey] → computed metrics */
const GOV_SUMMARY = new Proxy({}, { get(_, key){ return govComputeSummary(key); } });

function govSummaryLi(icon,tone,label,strong,num,act){
  return `<div class="gsum-li">
    <span class="gli-label"><span class="gli-ic tone-${tone}">${ic(icon,18)}</span>
      <span>${strong?`<b class="tone-${tone}">${strong}</b> `:''}${label}</span></span>
    <span class="gli-num">${num}</span>
    <span class="gli-act">${act}</span>
  </div>`;
}

function govSummaryCards(){
  const t = GOV.acctType;
  const cards = GOV_PROVIDER_CONFIG[GOV.provider];
  // build a summary list from any metric object
  const listFor = (m)=>`<div class="gsum-list">
    ${govSummaryLi('i-shield','danger','Credentials','Accounts with Invalid', m.invalid, 'Fix It')}
    ${govSummaryLi('i-alert','warn','Accounts','Deactivated', m.deact, 'Reactivate')}
    ${govSummaryLi('i-check-circle','ok','and Governed Accounts','Active', m.active, 'View')}
    ${m.cost!==undefined?govSummaryLi('i-coin','info','of Cost Governed','%', m.cost+'%', 'Improve'):''}
  </div>`;
  const cardHtml = (card)=>{
    if(card.tabs){
      const isActiveCard = card.tabs.some(tb=>tb.key===t);
      // Only the globally-active type's tab is solid blue. Tabs in other cards
      // stay plain (no false "active" highlight). The list shown is the active
      // tab when this card owns it, otherwise this card's first tab.
      const shownKey = isActiveCard ? t : card.tabs[0].key;
      const tabs = card.tabs.map(tb=>`<button class="gsum-tab ${t===tb.key?'on':''}" onclick="govSetType('${tb.key}')">
        <span class="gst-l" title="${tb.label}">${tb.label}</span><span class="gst-v">${GOV_SUMMARY[tb.key].count}</span></button>`).join('');
      return `<div class="gsum-card ${isActiveCard?'is-active':''}">
        <div class="gsum-tabs">${tabs}</div>
        ${listFor(GOV_SUMMARY[shownKey])}
      </div>`;
    } else {
      const k = card.single.key;
      const active = (t===k);
      return `<div class="gsum-card ${active?'is-active':''}">
        <div class="gsum-single ${active?'on':''}" onclick="govSetType('${k}')">
          <span class="gst-l" title="${card.single.label}">${card.single.label}</span><span class="gst-v">${GOV_SUMMARY[k].count}</span>
        </div>
        ${listFor(GOV_SUMMARY[k])}
      </div>`;
    }
  };
  return `<div class="gsum-scroll"><div class="gsum-row" data-cards="${cards.length}">
    ${cards.map(cardHtml).join('')}
  </div></div>`;
}

function govProgressCell(steps, opts){
  opts = opts || {};
  const [done,total]=steps;
  const pct = total>0 ? Math.round(done/total*100) : 0;
  const complete = total>0 && done===total;
  // caption styles: Completed (green) / In progress (muted) / Na
  let cap, capCls;
  if(total<=0){ cap='Na'; capCls='na'; }
  else if(complete){ cap='Completed'; capCls='ok'; }
  else { cap='In progress'; capCls='prog'; }
  const view = opts.view ? `<a class="gp-view">view <svg viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>` : '';
  const barColor = complete ? 'var(--success)' : (total>0 ? 'var(--success)' : 'var(--muted)');
  return `<div class="gprog">
    <div class="gp-top"><span>Steps - ${done}/${total}</span>${view}</div>
    <div class="gp-bar"><i style="width:${pct}%;background:${barColor}"></i></div>
    <div class="gp-cap ${capCls}">${cap}</div>
  </div>`;
}

      // explicit status pill when provided; else onboard button for not-onboarded
      if(r.onbStatus==='Onboarded') return `<span class="gstatus onboarded">Onboarded</span>`;
      if(r.onbStatus && /in\s*pro/i.test(r.onbStatus)) return `<span class="gstatus inprog">${r.onbStatus}</span>`;
      if(r.onb==='inprogress') return `<span class="gstatus inprog">In progress</span>`;
      return r.onb==='onboarded'?`<span class="gstatus onboarded">Onboarded</span>`:`<button class="gbtn-onboard">Onboard</button>`;
    case 'Processing Status': return govProgressCell(r.steps,{view:true});
    case 'Progress Status': return govProgressCell(r.steps);
    case 'Cloud Account Status':
    case 'Account Status':
      if(r.cstat==='Active') return `<span class="gstatus active">Active</span>`;
      if(r.cstat==='Deactivated') return `<span class="gstatus deact">Deactivated</span>`;
      return `<span class="gtag-na">NA</span>`;
    case 'Credential Status': {
      if(r.cred==='NA') return `<span class="gtag-na">NA</span>`;
      const pill = r.cred==='valid' ? `<span class="gcred-pill valid">Valid</span>`
                 : r.cred==='degraded' ? `<span class="gcred-pill degraded">Degraded</span>`
                 : `<span class="gcred-pill invalid">Invalid</span>`;
      const note = r.credNote ? `<div class="gcred-note">${r.credNote}</div>` : '';
      return `<div class="gcred-wrap">${pill}${note}</div>`;
    }
    case 'Currency': return r.currency==='NA'?`<span class="gtag-na">NA</span>`:r.currency;
    case 'Parent Account': return r.parent?`<span class="lnk">${r.parent}</span>`:`<span class="gtag-na">NA</span>`;
    case 'Department': return r.dept&&r.dept!=='NA'?r.dept:`<span class="gtag-na">NA</span>`;
    case 'Account': return r.account&&r.account!=='NA'?r.account:`<span class="gtag-na">NA</span>`;
    case 'Tenant': return r.tenant&&r.tenant!=='NA'?r.tenant:`<span class="gtag-na">NA</span>`;
    case 'Environment': return r.environment&&r.environment!=='NA'?r.environment:`<span class="gtag-na">NA</span>`;
    case 'Status on Cloud Provider': {
      if(!r.cloudStatus || r.cloudStatus==='NA') return `<span class="gtag-na">NA</span>`;
      const s=r.cloudStatus;
      const cls = (s==='Enabled')?'active' : (s==='Disabled'||s==='Deleted')?'deact' : 'inprog';
      return `<span class="gstatus ${cls}">${s}</span>`;
    }
    case 'FinOps': return r.finops==='NA'?`<span class="gtag-na">NA</span>`:r.finops;
    case 'Products': return r.products==='NA'?`<span class="gtag-na">NA</span>`:r.products;
    case 'Product List': {
      // show product list only when onboarded or in process
      const onboardedOrInProcess = (r.onbStatus==='Onboarded' || r.onbStatus==='Inprogress' || r.onbStatus==='In process' || r.onb==='onboarded' || r.onb==='inprogress');
      if(onboardedOrInProcess && r.products && r.products!=='NA'){
        return r.products.split(',').map(p=>`<span class="gprod">${p.trim()}</span>`).join(' ');
      }
      return `<span class="gtag-na">NA</span>`;
    }
    case 'Gov. Report Last run': return r.report==='NA'?`<span class="gtag-na">NA</span>`:r.report;
    case 'Onboarded By':
    case 'Onboarded by': {
      // only show when status is Onboarded or In process
      const showBy = (r.onbStatus==='Onboarded' || r.onbStatus==='Inprogress' || r.onbStatus==='In process' || r.onb==='onboarded' || r.onb==='inprogress');
      if(showBy && r.by && r.by!=='NA') return r.by;
      return `<span class="gtag-na">NA</span>`;
    }
    case 'Onboarded Date':
    case 'Created Date':
    case 'Created By': return r.date==='NA'?`<span class="gtag-na">NA</span>`:r.date;
    default: return '';
  }
}

  host.innerHTML = `<div class="wiz-modal-scrim">
    <div class="wiz-modal">
      <div class="wm-ico"><svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <h3>Onboarding Status</h3>
      <p>Your AWS cloud account is being onboarded. The platform is provisioning products and processing your configuration.</p>
      <div class="wm-prog"><i id="wizProgBar"></i></div>
      <div class="wm-prog-cap" id="wizProgCap">Onboarding in progress…</div>
      <button class="wiz-btn primary" onclick="awsWizGoDashboard()">Go to the Dashboard</button>
    </div>
  </div>`;
  // animate progress to complete
  setTimeout(()=>{ const b=document.getElementById('wizProgBar'); if(b) b.style.width='100%'; }, 80);
  setTimeout(()=>{ const c=document.getElementById('wizProgCap'); if(c) c.textContent='Onboarding completed successfully.'; }, 1000);
}
function awsWizGoDashboard(){ wizCloseModal(); govGoProviderDashboard('aws'); }

/* ================= Azure Cloud Account onboarding wizard ================= */
const AZ = {
  step:0,
  acctType:'subscription',  // subscription | ea | csp | mca
  environment:'global',     // global | gov
  access:'readonly',
  products:[],
  authProto:'application',  // application | managed
  cspProto:'app',           // CSP Direct: app | authcode
  validated:false,
  validationError:false,
  customTags:[],            // [{key, value}]
};
const AZ_STEPS = ['Azure Cloud Account Type','Prerequisites','Add & Validate Credentials','Basic Settings','Advanced Settings\n(optional)'];
const AZ_PRODUCTS = [
  {key:'finops', name:'FinOps', icon:'i-coin'},
  {key:'cloudops', name:'CloudOps', icon:'i-cloud'},
  {key:'assessments', name:'Assessments', icon:'i-clipboard'},
  {key:'secops', name:'SecOps', icon:'i-shield'},
  {key:'appsecops', name:'AppSecOps', icon:'i-cloud'},
];
function azWizStart(){ AZ.step=0; AZ.validated=false; AZ.validationError=false; AZ.customTags=[]; AZ.cspProto='app'; render('azure-onboard'); }

function azRail(){
  return AZ_STEPS.map((label,i)=>{
    const state = i<AZ.step ? 'done' : (i===AZ.step?'active':'todo');
    const numContent = state==='done' ? `<svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>` : (i+1);
    return `<div class="wiz-step ${state}"><span class="wn">${numContent}</span><span class="wl">${label.replace('\n','<br>')}</span></div>`;
  }).join('');
}

function azStep2(){
  const banner = AZ.validationError
    ? `<div class="wbanner err"><span class="wbico"><svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg></span><span class="wbtxt">Invalid credentials.</span><a class="wlog" onclick="wizViewLog()">View Log</a></div>`

  const btnLabel = AZ.validated ? 'Re-Validate' : 'Save &amp; Validate';
  // Azure EA (EA Application): Application Credentials only (Enrollment ID + Tenant/App), no protocol toggle
  if(AZ.acctType==='ea'){

      <div class="wlede">Authenticate and verify the permissions of an Azure cloud account for onboarding purposes.</div>
      ${banner}

    const cspCards = `<div class="wiz-card">
        <div class="wiz-card-h">Select Authentication Protocol</div>

    const cspForm = AZ.cspProto==='authcode'
      ? `<div class="wiz-card">
          <div class="wiz-card-h">Authorization Code Credentials</div>
          <div class="wfield"><label>Tenant ID <span class="req">*</span></label><input placeholder="Enter Tenant ID"></div>
          <div class="wfield"><label>Application ID <span class="req">*</span></label><input class="ro" value="Uat_01" readonly></div>
          <div class="wfield"><label>Application Secret <span class="req">*</span></label><input class="ro" type="password" value="appsecret" readonly></div>
          <div class="wfield"><label>Redirect URI <span class="req">*</span></label><input placeholder="Enter Redirect URI"></div>
          <div class="wfield"><label>Authorization Code <span class="req">*</span></label><input placeholder="Enter Authorization Code"></div>
