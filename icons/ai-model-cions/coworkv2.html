        </div>`
      : `<div class="wiz-card">
          <div class="wiz-card-h">App Credentials</div>
          <div class="wfield"><label>Tenant ID <span class="req">*</span></label><input class="ro" value="Uat_01" readonly></div>
          <div class="wfield"><label>Application ID <span class="req">*</span></label><input placeholder="Enter Application ID"></div>
          <div class="wfield"><label>Application Secret <span class="req">*</span></label><input class="ro" type="password" value="appsecret" readonly></div>
          <button class="wiz-btn primary" onclick="azValidate()">${btnLabel}</button>
        </div>`;
    return `<h2>Add &amp; Validate Credentials</h2>
      <div class="wlede">Authenticate and verify the permissions of an Azure cloud account for onboarding purposes.</div>
      ${banner}${cspCards}${cspForm}`;
  }
  const protoCards = `<div class="wiz-card">
      <div class="wiz-card-h">Select Authentication Protocol</div>
      <div class="wopt-row">
        ${wizOpt(AZ.authProto==='application','Application','Application credentials which has permission to the subscription',"azSet('authProto','application')")}
        ${wizOpt(AZ.authProto==='managed','Managed Identity','Managed Identity which has permission to the subscription, associated virtual machine (Linux) and application credentials to access the virtual machine.',"azSet('authProto','managed')")}
      </div>
      ${AZ.authProto==='managed' ? `<div class="wbanner err" style="margin:16px 0 0;box-shadow:none;border:none;background:transparent;padding:0;gap:12px"><span class="wbico" style="background:#EC7211;width:38px;height:38px"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3l9 16H3l9-16z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 10v4M12 17h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span><span class="wbtxt" style="color:#C4461E;font-size:13.5px">Managed Identity credentials requires a running linux virtual machine, making access potentially unreliable. Please consider using application credentials for reliability.</span></div>` : ''}
    </div>`;
  const credForm = AZ.authProto==='application'
    ? `<div class="wiz-card">
        <div class="wiz-card-h">Application Credentials</div>
        <div class="wfield"><label>Tenant ID <span class="req">*</span></label><input class="ro" value="Uat_01" readonly></div>
        <div class="wfield"><label>Application ID <span class="req">*</span></label><input placeholder="Enter Application ID"></div>
        <div class="wfield"><label>Application Secret <span class="req">*</span></label><input class="ro" type="password" value="appsecret" readonly></div>
        <button class="wiz-btn primary" onclick="azValidate()">${btnLabel}</button>
      </div>`
    : `<div class="wiz-card">
        <div class="wiz-card-h">Managed Identity Credentials</div>
        <div class="wfield"><label>Tenant ID <span class="req">*</span></label><input placeholder="Enter Tenant ID"></div>
        <div class="wfield"><label>Application ID <span class="req">*</span></label><input class="ro" value="Uat_01" readonly></div>
        <div class="wfield"><label>Application Secret <span class="req">*</span></label><input class="ro" type="password" value="appsecret" readonly></div>
        <div class="wfield"><label>Virtual Machine ID <span class="req">*</span></label><input placeholder="Enter Virtual Machine ID"></div>
        <div class="wfield"><label>Manage Identity Client ID <span class="req">*</span></label><input placeholder="Enter Manage Identity Client ID"></div>
        <button class="wiz-btn primary" onclick="azValidate()">${btnLabel}</button>
      </div>`;
  return `<h2>Add &amp; Validate Credentials</h2>
    <div class="wlede">Authenticate and verify the permissions of an Azure cloud account for onboarding purposes.</div>
    ${banner}${protoCards}${credForm}`;
}

    </div>`;

const AZ_BODIES = [azStep0, azStep1, azStep2, azStep3, azStep4];

function screenAzureOnboard(){
  const isLast = AZ.step===AZ_STEPS.length-1;
  const nextDisabled = (AZ.step===2 && !AZ.validated);
  const actions = isLast
    ? `<button class="wiz-btn ghost" onclick="azWizCancel()">Cancel</button>
       <button class="wiz-btn primary" onclick="azWizFinish()">Finish</button>`
    : `<button class="wiz-btn ghost" onclick="azWizCancel()">Cancel</button>
       <button class="wiz-btn primary" ${nextDisabled?'disabled':''} onclick="azWizNext()">Next <svg viewBox="0 0 24 24" fill="none" style="width:16px;height:16px"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`;
  return `<div class="center-wrap fade">
    <div class="wiz-head">
      <div><h1>Onboard Azure Cloud Account</h1>
        <div class="wsub">Follow the steps to complete the requirements for onboarding this cloud account.</div></div>
      <div class="wiz-actions">${actions}</div>
    </div>
    <div class="wiz-layout">
      <aside class="wiz-rail">${azRail()}</aside>
      <section class="wiz-main" id="azMain">${AZ_BODIES[AZ.step]()}</section>
    </div>
    <div id="wizModalHost"></div>
  </div>`;
}
screens['azure-onboard'] = ()=>screenAzureOnboard();

function azSet(k,v){
  AZ[k]=v;
  if(k==='authProto' || k==='cspProto'){ AZ.validated=false; AZ.validationError=false; }
  azWizRerender();
}
function azToggleProduct(key){
  const i=AZ.products.indexOf(key);
  if(i>=0) AZ.products.splice(i,1); else AZ.products.push(key);
  azWizRerender();
}
function azToggleAll(){
  AZ.products = AZ.products.length===AZ_PRODUCTS.length ? [] : AZ_PRODUCTS.map(p=>p.key);
  azWizRerender();
}
function azAcctNameCount(inp){ const c=document.getElementById('azAcctCount'); if(c) c.textContent=(inp.value.length)+' / 50 characters'; }
function azAddTag(){
  const k=document.getElementById('azTagKey'), v=document.getElementById('azTagVal');
  if(!k) return;
  const key=(k.value||'').trim(), val=(v?v.value:'').trim();
  if(!key) return;  // key is required
  AZ.customTags.push({key, value:val});
  azWizRerender();
}
function azRemoveTag(i){ AZ.customTags.splice(i,1); azWizRerender(); }
function azValidate(isCost){
  // demo: Managed Identity path errors once; Application succeeds
  if(!isCost && AZ.authProto==='managed' && !AZ.validationError && !AZ.validated){
    AZ.validationError=true; AZ.validated=false;
  } else {
    AZ.validated=true; AZ.validationError=false;
  }
  azWizRerender();
  render('azure-onboard');
}
function azWizRerender(){ const m=document.getElementById('azMain'); if(m) m.innerHTML = AZ_BODIES[AZ.step](); }
function azWizNext(){ if(AZ.step<AZ_STEPS.length-1){ AZ.step++; render('azure-onboard'); } }
function azWizCancel(){ go('gov-onboard'); }
function azWizFinish(){
  const host=document.getElementById('wizModalHost'); if(!host){ go('gov-cloud-account'); return; }
  host.innerHTML = `<div class="wiz-modal-scrim">
    <div class="wiz-modal">
      <div class="wm-ico"><svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <h3>Onboarding Status</h3>
      <p>Your Azure cloud account is being onboarded. The platform is provisioning products and processing your configuration.</p>
      <div class="wm-prog"><i id="azProgBar"></i></div>
      <div class="wm-prog-cap" id="azProgCap">Onboarding in progress…</div>
      <button class="wiz-btn primary" onclick="azWizGoDashboard()">Go to the Dashboard</button>
    </div>
  </div>`;
  setTimeout(()=>{ const b=document.getElementById('azProgBar'); if(b) b.style.width='100%'; }, 80);

/* Build the action item list for a row, given the active account-type key. */
function govActionItems(typeKey, r){
  const def = GOV_TYPES[typeKey] || {};
  const items = [];
  const notOnboarded = (r.onb !== 'onboarded' && r.onb !== 'inprogress');

  // --- Azure Enterprise Agreement: View, Edit, Activate (if inactive), Delete ---
  if(typeKey==='az-ea'){
    if(notOnboarded) items.push({label:'Onboard Account', icon:'onboard'});
    items.push({label:'View', icon:'view'});
    items.push({label:'Edit', icon:'edit'});
    if(r.cstat!=='Active'){  // Activate only when cloud account status is inactive
      items.push({label:'Activate', icon:'activate'});
    }
    items.push({divider:true});
    items.push({label:'Delete', icon:'trash', destructive:true});
    return items;
  }

  // --- Azure Microsoft Partner Agreements (CSP) + MCA Billing + MCA Subscriptions ---
  //   Onboarded: View, Edit, Deactivate, Delete | Not onboarded: Onboard | In progress: none
  if(typeKey==='az-csp' || typeKey==='az-mca' || typeKey==='az-mca-sub'){
    const inProgress = (r.onb==='inprogress' || /progress/i.test(r.onbStatus||''));
    if(inProgress) return [];                       // no actions while in progress
    if(notOnboarded) return [{label:'Onboard Account', icon:'onboard'}];
    items.push({label:'View', icon:'view'});
    items.push({label:'Edit', icon:'edit'});
    items.push({label:'Deactivate', icon:'deactivate'});
    items.push({divider:true});
    items.push({label:'Delete', icon:'trash', destructive:true});
    return items;
  }

  // --- Azure Microsoft Partner Agreements Subscription ---
  //   Onboarded: View, Edit, Deactivate, Delete | Not onboarded: Add/update tags
  if(typeKey==='az-csp-sub'){
    if(notOnboarded) return [{label:'Add/Update Tags', icon:'tags'}];
    items.push({label:'View', icon:'view'});
    items.push({label:'Edit', icon:'edit'});
    items.push({label:'Deactivate', icon:'deactivate'});
    items.push({divider:true});
    items.push({label:'Delete', icon:'trash', destructive:true});
    return items;
  }

  // --- Azure Individual Subscriptions ---
  //   Onboarded: View, Edit, Deactivate, Trigger FinOps Gov. Report, Change Access Type, Delete
  //   Not onboarded: Onboard
  if(typeKey==='az-individual-sub'){
    if(notOnboarded) return [{label:'Onboard Account', icon:'onboard'}];
    items.push({label:'View', icon:'view'});
    items.push({label:'Edit', icon:'edit'});
    items.push({label:'Deactivate', icon:'deactivate'});
    items.push({label:'Trigger FinOps Governance Report', icon:'report'});
    items.push({label:'Change Access Type', icon:'access'});
    items.push({divider:true});
    items.push({label:'Delete', icon:'trash', destructive:true});
    return items;
  }

  // --- GCP (all four account types) + OCI Tenancies ---
  //   Onboarded: View, Edit, Deactivate, Delete
  //   Not onboarded: Assign to Tenant, Add/Update Tags | In progress: none
  if(typeKey==='gcp-org' || typeKey==='gcp-billing' || typeKey==='gcp-project' || typeKey==='gcp-individual-project' || typeKey==='oci-tenancy'){
    const inProgress = (r.onb==='inprogress' || /progress/i.test(r.onbStatus||''));
    if(inProgress) return [];                       // no actions while in progress
    if(notOnboarded) return [
      {label:'Assign to Tenant', icon:'assign'},
      {label:'Add/Update Tags', icon:'tags'},
    ];
    items.push({label:'View', icon:'view'});
    items.push({label:'Edit', icon:'edit'});
    items.push({label:'Deactivate', icon:'deactivate'});
    items.push({divider:true});
    items.push({label:'Delete', icon:'trash', destructive:true});
    return items;
  }

  // --- default (AWS / other providers) ---
  if(notOnboarded){
    items.push({label:'Onboard Account', icon:'onboard'});
  }
  items.push({label:'View', icon:'view'});
  items.push({label:'Edit', icon:'edit'});
  items.push({label:'Deactivate', icon:'deactivate'});
  items.push({label:'Trigger FinOps Governance Report', icon:'report'});
  if(isChild){
    items.push({label:'Change Access Type', icon:'access'});
  }
  items.push({divider:true});
  items.push({label:'Delete', icon:'trash', destructive:true});
  return items;
}
function govOpenActions(ev, i){
  ev.stopPropagation();
  const type = GOV.acctType;
  const r = GOV_TYPES[type].rows[i];
  // toggle: if the menu for this same trigger is open, close it
  const host = document.getElementById('govActionHost');
  if(host.dataset.open === type+'-'+i){ govCloseActions(); return; }
  const items = govActionItems(type, r);
  const menu = items.length===0
    ? `<div class="dam-empty">No actions available</div>`
    : items.map(it=> it.divider
        ? `<div class="dam-divider"></div>`
        : `<button class="dam-item ${it.destructive?'destructive':''}" onclick="govDoAction('${it.label.replace(/'/g,"\\'")}','${r.name.replace(/'/g,"\\'")}')">${DAM_ICONS[it.icon]||''}${it.label}</button>`
      ).join('');
  host.innerHTML = `<div class="dam-scrim" onclick="govCloseActions()"></div><div class="dam-menu" id="govActionMenu" role="menu">${menu}</div>`;
  host.dataset.open = type+'-'+i;
  // position next to the trigger button
  const btn = ev.currentTarget.getBoundingClientRect();
  const m = document.getElementById('govActionMenu');
  const mw = m.offsetWidth, mh = m.offsetHeight;
  let left = btn.right - mw;                 // right-align menu to the kebab
  let top = btn.bottom + 4;
  if(left < 8) left = 8;
  if(top + mh > window.innerHeight - 8){ top = btn.top - mh - 4; } // flip up if no room
  m.style.left = left + 'px';
  m.style.top = top + 'px';
}
function govCloseActions(){
  const host = document.getElementById('govActionHost');
  if(host){ host.innerHTML=''; host.dataset.open=''; }
}
function govDoAction(label, name){
  govCloseActions();
  // prototype stub — surface the chosen action
  alert(label + ' → ' + name);
}

function runPrereqs(){
  const data=[['21 connected','ok','var(--success)','var(--success-l)'],['3 orgs configured','ok','var(--success)','var(--success-l)'],['38% untagged','warn','var(--warning)','var(--warning-l)'],['Slack, Email ready','ok','var(--success)','var(--success-l)']];
  let i=0;

      const sp=document.getElementById('preqSpinner'); if(sp)sp.style.display='none';
      const t=document.getElementById('preqTitle'); if(t)t.textContent='Prerequisites Verified';
      const d=document.getElementById('preqDesc'); if(d)d.textContent='All checks complete. 3 of 4 passed · tag coverage warning. You can continue.';
      const b=document.getElementById('preqContinue'); if(b){b.classList.remove('btn-disabled');b.classList.add('btn-primary');}
      return;
    }
    const card=document.getElementById('preq'+i); if(!card){return;}
    const [sub,state,col,bg]=data[i];
    card.classList.add('anim-working');               // task execution: working shimmer
    document.getElementById('preqSub'+i).textContent=sub;
    setTimeout(()=>{                                   // goal achievement: resolve row state
      card.classList.remove('anim-working','is-checking');
      card.classList.add('anim-verified', state==='warn'?'is-warn':'is-ok');
      const end=document.getElementById('preqEnd'+i);
      if(!end){return;}
      if(state==='warn'){
        end.className='preq-status ps-warn';
        end.innerHTML=`<svg class="svg anim-check" style="width:14px;height:14px"><use href="#i-alert"/></svg> Warning`;
      }else{
        end.className='preq-status ps-ok';
        end.innerHTML=`<svg class="svg anim-check" style="width:14px;height:14px"><use href="#i-check"/></svg> Verified`;
      }
    },350);
    i++;
    const bar=document.getElementById('preqBar'); if(bar){if(bar.parentElement)bar.parentElement.classList.add('anim-fill');bar.style.width=(i/4*100)+'%';}
    const cnt=document.getElementById('preqCount'); if(cnt)cnt.textContent=i+'/4';
    setTimeout(step, 850);
  }
  step();
}

/* ===== OSCAR nav behavior ===== */
function navL1(id){
  const nav=document.getElementById('nav'); const it=document.getElementById(id);
  if(!nav.classList.contains('expanded')){ nav.classList.add('expanded'); }
  const hasChildren = !!it.querySelector('.l2-container');
  const wasOpen = it.classList.contains('open');
  nav.querySelectorAll('.l1-item').forEach(e=>e.classList.remove('open'));   // accordion: collapse all
  if(hasChildren){
    nav.querySelectorAll('.l1-item').forEach(e=>e.classList.remove('active'));
    it.classList.add('active');                                              // highlight follows selection
    if(!wasOpen) it.classList.add('open');                                   // re-click toggles collapse
  }
}
function navL2(btn,key){
  document.querySelectorAll('.l2-trigger').forEach(b=>b.classList.remove('active-l2'));
  btn.classList.add('active-l2');
  go(key);
}
/* expand/collapse an L2 group that owns an L3 submenu (e.g. Account Governance, Guardrails) */
function navL2group(id){
  const grp=document.getElementById(id);
  const wasOpen=grp.classList.contains('open');
  // accordion within the same parent: collapse sibling l2-groups
  grp.parentNode.querySelectorAll('.l2-group').forEach(g=>{ if(g!==grp) g.classList.remove('open'); });
  grp.classList.toggle('open', !wasOpen);
}
/* select an L3 leaf and route to its screen */
function navL3(btn,key){
  document.querySelectorAll('.l2-trigger').forEach(b=>b.classList.remove('active-l2'));
  document.querySelectorAll('.l3-trigger').forEach(b=>b.classList.remove('active-l3'));
  btn.classList.add('active-l3');
  go(key);

function agxSuggestion(){
  const P = AGX_META[AGX.agent].prompts;

function agxQuick(p){ AGX.composer=p; agxSend(); }

function agxSend(){
  const text = AGX.composer.trim();
  if(!text || AGX.working) return;
  AGX.msgs.push({role:'user',text});
  if(AGX.chatId===null){                       // new conversation → save to history
    const id='c'+Date.now();
    agxHist().unshift({id, title: text.length>42 ? text.slice(0,42)+'…' : text,
      date:'Today · '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),
      msgs:AGX.msgs});                          // same array reference → stays in sync
    AGX.chatId=id;
  }
  AGX.composer=''; AGX.working=true; AGX.drawer=null;
  const mySeq = ++AGX.seq;
  if(AGX.agent==='rateoptimization'){ roThinkRun(text, mySeq); render(current); agxScrollEnd(); return; }
  render(current); agxScrollEnd();
  setTimeout(()=>{
    if(mySeq!==AGX.seq) return;            // chat was reset meanwhile
    AGX.working=false;
    const a = agxAnswer(text);
    AGX.msgs.push(Object.assign({role:'agent'}, typeof a==='string' ? {html:a} : a));
    render(current); agxScrollEnd();
  }, 2200);
}
/* ---------- Rate Optimization: staged "Thinking…" agentic flow ---------- */
const RO_STEPS = [
  {after:0,    line:'Verifying account balance…'},
  {after:550,  line:'AI agent analyzing your request and generating response'},
  {after:1100, line:'Identifying skill…', ico:'search'},
  {after:1500, line:'Using Ro Portfolio skill', ico:'ok', task:0},   // first task spinner→done
  {after:2100, line:'Identifying skill…', ico:'search'},
  {after:2500, line:'Using Ro Portfolio skill', ico:'ok'},
  {after:3100, line:'Fetching your AWS commitments performance data…', ico:'search'},
  {after:3800, line:'Retrieved your AWS commitments performance data.', ico:'ok', task:0},
  {after:4300, line:'Preparing your results…', ico:'sparkle', task:1},
];
function roThinkRun(text, mySeq){
  RO_THINK = {tasks:[false,false], lines:[], t0:Date.now()};
  // schedule each step
  RO_STEPS.forEach(step=>{
    setTimeout(()=>{
      if(mySeq!==AGX.seq) return;
      RO_THINK.lines.push({txt:step.line, ico:step.ico||null});
      if(step.task===0) RO_THINK.tasks[0]=true;
      if(step.task===1){ RO_THINK.tasks[0]=true; RO_THINK.tasks[1]=true; }
      roThinkRender();
    }, step.after);
  });
  // finish: replace thinking with the table answer
  setTimeout(()=>{
    if(mySeq!==AGX.seq) return;
    AGX.working=false; RO_THINK=null;
    const a = agxAnswer(text);
    AGX.msgs.push(Object.assign({role:'agent'}, a));
    render(current); agxScrollEnd();
  }, 5000);
}
function roThinkRender(){
  const host=document.getElementById('roThinkHost');
  if(host){ host.innerHTML = roThinkPanel(); agxScrollEnd(); }
}
function roThinkPanel(){
  if(!RO_THINK) return '';
  const taskRow = (label,done,active)=>`<div class="ro-task">
      <span class="ro-task-box ${done?'done':(active?'active':'')}">${done?'<svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>':''}</span>
      <span class="ro-task-label ${done?'done':''}">${label}</span>
    </div>`;
  const t0done = RO_THINK.tasks[0], t1done = RO_THINK.tasks[1];
  const lineIco = (ico)=> ico==='ok' ? '<span class="ro-li ok">✅</span>'
                        : ico==='search' ? '<span class="ro-li">🔍</span>'
                        : ico==='sparkle' ? '<span class="ro-li">✨</span>' : '';
  return `<div class="ro-think">
    <div class="ro-think-head"><span class="think-dots"><i></i><i></i><i></i></span> Thinking…</div>
    <div class="ro-tasks">
      <div class="ro-tasks-h">TASKS</div>
      ${taskRow('Retrieve data on how my AWS commitments are performing', t0done, !t0done)}
      ${taskRow('Produce the final user-facing answer', t1done, t0done&&!t1done)}
    </div>
    <div class="ro-lines">
      ${RO_THINK.lines.map(l=>`<div class="ro-line">${lineIco(l.ico)}${agxEsc(l.txt)}</div>`).join('')}
    </div>
  </div>`;
}

function agxLoadChat(id){

/* ---------- agent answers ---------- */
function agxMsgHtml(msg){
  if(msg.kind==='asmtable') return agxAsmTable(msg);
  if(msg.kind==='asmdonut') return agxAsmDonut();
  if(msg.kind==='rotable') return roTable(msg);
  return msg.html;
}
/* every intent declares follow-up prompts → the chips row continues the flow */
function agxNext(...prompts){ AGX.followups = prompts; }
function agxAnswer(q){
  const s=q.toLowerCase();
  AGX.followups = [];
  if(AGX.agent==='rateoptimization'){
    agxNext('Show underutilized commitments generating negative savings','Which reservations have the highest net savings?');
    return {kind:'rotable', page:0, pp:10};
  }
  if(AGX.agent==='assessmentagent'){
    if(s.includes('donut') || (s.includes('region') && s.includes('violation'))){
      agxNext('Show total resources violations for ASM_1','Which cloud accounts contribute most violations in ASM_1?');
      return {kind:'asmdonut'};
    }
    if(s.includes('total') && s.includes('violation')){
      agxNext('List failed policies by severity in ASM_1','Show resource violations by region in ASM_1 in a donut');
      return {kind:'asmtable', page:0, pp:4, expanded:false};
    }
    if(s.includes('framework')){ agxNext('Show policy compliance summary for assessment ASM_1','Show resource violations by region in ASM_1 in a donut'); return agxAnsAsmFrameworks(); }
    if(s.includes('compare') || s.includes('previous run')){ agxNext('Show total resources violations for ASM_1','List failed policies by severity in ASM_1'); return agxAnsAsmCompare(); }
    if(s.includes('cloud account') || s.includes('contribute')){ agxNext('Show total resources violations for ASM_1','Compare violations in ASM_1 against the previous run'); return agxAnsAsmAccounts(); }
    if(s.includes('compliance') || s.includes('summary')){ agxNext('List failed policies by severity in ASM_1','Show total resources violations for ASM_1'); return agxAnsAsmSummary(); }
    if(s.includes('severity') || s.includes('failed policies')){ agxNext('Show total resources violations for ASM_1','Which cloud accounts contribute most violations in ASM_1?'); return agxAnsAsmSeverity(); }
    return `<p>I analyzed assessment <b>ASM_1</b> for tenant <b>Corsatck_tenant</b>.</p>
    <p>I can chart <b>resource violations by region</b>, list <b>all violating resources</b> with their policies, and compare runs. Try one of the suggested prompts below, or ask about a specific assessment, policy or resource.</p>`;
  }
  if(s.includes('7.5') && s.includes('component')){ agxNext("Show all critical vulnerabilities ranked by Graphion Risk Score for the current tenant.",'Show new vulnerabilities introduced in the latest build'); return agxAnsComponents75(); }
  if(s.includes('7.5')){ agxNext('Show projects with component and vulnerability deltas','Show new vulnerabilities introduced in the latest build'); return agxAnsCritProjects(); }
  if(s.includes('risk summary')){ const pj=agxParam(q,'Proj-Pay-API'); agxNext(`What is the security posture of the latest build of project '${pj}'?`,'Show new vulnerabilities introduced in the latest build'); return agxAnsBuildSummary(pj); }
  if(s.includes('posture')){ const pj=agxParam(q,'Proj-Pay-API'); agxNext(`Provide a risk summary for the latest build of project '${pj}'`,'Show projects with KEVs added in the last build'); return agxAnsPosture(pj); }
  if(s.includes('top 10')){ const ap=agxParam(q,'PaymentSvc'); agxNext(`Show all critical vulnerabilities ranked by Graphion Risk Score for my application '${ap}'.`,'Show new exploitable vulnerabilities (KEVs) added in the last 24 hours'); return agxAnsTopPrev(10, ap); }
  if(s.includes('applications') && s.includes('related')){ const pf=agxParam(q,'Port1'); agxNext(`Show all critical vulnerabilities ranked by Graphion Risk Score for the portfolio '${pf}'.`,"Show all projects within the application 'PaymentSvc'."); return agxAnsPortfolioApps(pf); }
  if(s.includes('projects within')){ const ap=agxParam(q,'PaymentSvc'); agxNext('Which projects have the most critical vulnerabilities?','Show projects with component and vulnerability deltas'); return agxAnsAppProjects(ap); }
  if(s.includes('applications have the most')){ agxNext("Show all critical vulnerabilities ranked by Graphion Risk Score for my application 'PaymentSvc'.",'Which projects have the most critical vulnerabilities?'); return agxAnsAppsMost(); }
  if(s.includes('projects have the most')){ agxNext('List projects with critical vulnerabilities with risk score > 7.5','Show projects with KEVs added in the last build'); return agxAnsProjectsMost(); }
  if(s.includes('critical vulnerabilities') && s.includes('risk score')){
    agxNext('Show projects with KEVs added in the last build','Summarize unresolved critical infrastructure vulnerabilities older than 30 days');
    if(s.includes('tenant'))      return agxAnsRanked('tenant');
    if(s.includes('application')) return agxAnsRanked('application', agxParam(q,'PaymentSvc'));
    return agxAnsRanked('portfolio', agxParam(q,'Port1'));
  }
  if(s.includes('portfolios')){ agxNext('For portfolio Port1, show all critical vulnerabilities ranked by CoreStack Risk Score','Show projects with component and vulnerability deltas'); return agxAnsPortfolios(); }
  if(s.includes('sbom')){ agxNext('Show new exploitable vulnerabilities (KEVs) added in the last 24 hours','For portfolio Port1, show all critical vulnerabilities ranked by CoreStack Risk Score'); return agxAnsP2(); }
  if(s.includes('kev') && (s.includes('project') || s.includes('build'))){ agxNext('Show new vulnerabilities introduced in the latest build','Summarize unresolved critical infrastructure vulnerabilities older than 30 days'); return agxAnsKevProjects(); }

/* — reusable mini bar chart (SVG, OSCAR-toned) — */
function agxBarChart(title, color, data, yMax, unit, xLabel, yLabel){
  const W=432, H=230, padL=50, padR=8, padT=24, padB=46;
  const cw=W-padL-padR, ch=H-padT-padB, ticks=4;
  const band=cw/data.length, bw=Math.min(38, band*0.55);
  let grid='';
  for(let t=0;t<=ticks;t++){
    const v=Math.round(yMax/ticks*t), y=padT+ch-(v/yMax)*ch;
    grid+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" class="gl"/>
           <text x="${padL-6}" y="${y+3.5}" text-anchor="end" class="ax">${v}${unit}</text>`;
  }
  const bars=data.map((d,i)=>{
    const h=Math.max(2,(d.y/yMax)*ch), x=padL+band*i+(band-bw)/2, y=padT+ch-h;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" rx="4"
      style="--i:${i}" fill="${color}" opacity="${d.hl?1:0.7}"><title>${d.x}: ${d.y}${unit}</title></rect>
    <text x="${(x+bw/2).toFixed(1)}" y="${(y-5).toFixed(1)}" text-anchor="middle" class="vl" style="--i:${i}">${d.y}${unit}</text>
    <text x="${(x+bw/2).toFixed(1)}" y="${padT+ch+15}" text-anchor="middle" class="ax">${d.x}</text>`;
  }).join('');
  const yAxisLabel = `<text transform="rotate(-90)" x="${-(padT+ch/2)}" y="13" text-anchor="middle" class="axl">${yLabel}</text>`;
  const xAxisLabel = `<text x="${padL+cw/2}" y="${H-8}" text-anchor="middle" class="axl">${xLabel}</text>`;
  return `<div class="agx2-chartcard"><div class="ct">${title}</div>
    <svg viewBox="0 0 ${W} ${H}" class="agx2-chart" role="img" aria-label="${title}">${grid}${bars}${yAxisLabel}${xAxisLabel}</svg></div>`;
}

/* ---------- nav / breadcrumb integration ---------- */
const _syncNavCowork = syncNav;
syncNav = function(key){
  const isGov = key in GOV_META;
  const isAgx = key in AGX_META;
  if(key!=='appsecops' && key!=='assessmentagent'){
    const host=document.getElementById('agxDrawerHost'); if(host) host.innerHTML=''; AGX.drawer=null;
  }
  const gov = document.getElementById('l1-gov');
  const cow = document.getElementById('l1-cowork'), aia = document.getElementById('l1-aiagents');

  if(key==='gov-onboard' || key==='aws-onboard' || key==='azure-onboard'){
    // Onboarding landing / provider wizard — reached from the Onboard flow.
    [cow,aia].forEach(e=>{ e.classList.remove('active'); e.classList.remove('open'); });
    gov.classList.add('active'); gov.classList.add('open');
    document.querySelectorAll('#l1-cowork .l2-trigger, #l1-aiagents .l2-trigger').forEach(b=>b.classList.remove('active-l2'));
    document.querySelectorAll('#l1-gov .l3-trigger').forEach(b=>b.classList.remove('active-l3'));
    document.getElementById('bcHome').style.display='flex';
    document.getElementById('bcHomeSep').style.display='flex';
    document.getElementById('bcParent').textContent='Settings';
    document.getElementById('bcParent2').style.display='none';
    document.getElementById('bcParent2Sep').style.display='none';
    document.getElementById('bcCurrent').textContent= key==='aws-onboard' ? 'Onboard AWS Cloud Account' : (key==='azure-onboard' ? 'Onboard Azure Cloud Account' : 'Onboard Providers');
    document.getElementById('tenantValue').textContent='Tenant Account';
    document.getElementById('segWrap').style.display='none';
    return;
  }

  if(isGov){
    // Governance branch: highlight Governance L1, keep its submenu open, sync L3 highlight
    [cow,aia].forEach(e=>{ e.classList.remove('active'); e.classList.remove('open'); });
    gov.classList.add('active'); gov.classList.add('open');
    document.querySelectorAll('#l1-cowork .l2-trigger, #l1-aiagents .l2-trigger').forEach(b=>b.classList.remove('active-l2'));
    document.querySelectorAll('#l1-gov .l3-trigger').forEach(b=>b.classList.toggle('active-l3', b.dataset.go===key));
    const m = GOV_META[key];
    document.getElementById('bcHome').style.display='flex';
    document.getElementById('bcHomeSep').style.display='flex';
    document.getElementById('bcParent').textContent='Governance';
    const bp2 = document.getElementById('bcParent2'), bp2s = document.getElementById('bcParent2Sep');
    bp2.textContent = m.parent; bp2.style.display='inline'; bp2s.style.display='flex';
    document.getElementById('bcCurrent').textContent = m.bc;
    document.getElementById('tenantValue').textContent='Tenant Account';
    document.getElementById('segWrap').style.display='none';
    return;
  }

  // non-governance: ensure Governance L1 deactivates + hide 3rd breadcrumb segment
  gov.classList.remove('active');
  document.querySelectorAll('#l1-gov .l3-trigger').forEach(b=>b.classList.remove('active-l3'));
  document.getElementById('bcParent2').style.display='none';
  document.getElementById('bcParent2Sep').style.display='none';

  cow.classList.toggle('active', !isAgx);
  aia.classList.toggle('active', isAgx);
  cow.classList.toggle('open', !isAgx);
  aia.classList.toggle('open', isAgx);
  document.getElementById('bcParent').textContent = isAgx ? 'AI Agents' : 'CoWork';
  document.getElementById('bcCurrent').textContent = isAgx ? AGX_META[key].bc : 'Outcomes';
  document.getElementById('bcHome').style.display = isAgx ? 'flex' : 'none';
  document.getElementById('bcHomeSep').style.display = isAgx ? 'flex' : 'none';
  document.getElementById('tenantValue').textContent = isAgx ? 'Corsatck_tenant' : 'Tenant Account';
  document.getElementById('segWrap').style.display = isAgx ? 'none' : '';
  if(isAgx){
    document.querySelectorAll('#l1-aiagents .l2-trigger').forEach(b=>b.classList.toggle('active-l2', b.dataset.go===key));
    document.querySelectorAll('#l1-cowork .l2-trigger').forEach(b=>b.classList.remove('active-l2'));
  } else {
    document.querySelectorAll('#l1-aiagents .l2-trigger').forEach(b=>b.classList.remove('active-l2'));
    _syncNavCowork(key);
  }
};

<script>
/* CoreStack Knowledge Graph — Tenant > Provider > Account > Region > commitments

const DATA = JSON.parse(document.getElementById('treeData').textContent);
const PROV_COLOR = '#5E6C84';
const KIND = {
  tenant:{raw:'#172B4D',label:'Tenant'}, provider:{raw:PROV_COLOR,label:'Cloud Provider'},
  account:{raw:'#0076E1',label:'Cloud Account'}, region:{raw:'#00B8D9',label:'Region'},
  ri:{raw:'#36B37E',label:'Reserved Instance'}, sp:{raw:'#7C3AED',label:'Savings Plan'},
  rirec:{raw:'#17A2B8',label:'RI Recommendation'}, sprec:{raw:'#E83E8C',label:'SP Recommendation'},
  budget:{raw:'#FF9F1C',label:'Budget'}, anomaly:{raw:'#E5484D',label:'Cost Anomaly'}
};
const LEAFK=['ri','sp','rirec','sprec','budget','anomaly'];
const BOXCFG={
  ri:{title:'Reserved Instances',tag:'RI',color:'#36B37E'},
  sp:{title:'Savings Plans',tag:'SP',color:'#7C3AED'},
  rirec:{title:'RI Recommendations',tag:'RI+',color:'#17A2B8'},
  sprec:{title:'SP Recommendations',tag:'SP+',color:'#E83E8C'},
  budget:{title:'Budgets',tag:'$',color:'#FF9F1C'},
  anomaly:{title:'Anomalies',tag:'!',color:'#E5484D'}
};
function provColor(){ return PROV_COLOR; }
const SVGNS='http://www.w3.org/2000/svg';
function svgEl(tag,attrs){const e=document.createElementNS(SVGNS,tag);if(attrs)for(const k in attrs)e.setAttribute(k,attrs[k]);return e;}

let UID=0;
function build(src,parent,depth){
  const n={uid:++UID,id:src.id,label:src.label,kind:src.kind,meta:src.meta||{},xtra:src.xtra||null,parent,depth,children:null,_children:null,_units:[],x:0,y:0};
  const kids=(src.children||[]).map(c=>build(c,n,depth+1));
  n._allkids=kids; n.children=kids.length?kids:null; return n;
}
const ROOT=build(DATA,null,0);
/* initial: collapse regions + accounts so default view is compact (tenant > provider > account) */
(function ic(n){(n._allkids||[]).forEach(ic);if((n.kind==='region'||n.kind==='account')&&n.children){n._children=n.children;n.children=null;}})(ROOT);

const NODE_W=176,NODE_H=48,H_GAP=30,ROW_H=140;
const BOX_W=326,BOX_HEAD=44,BOX_SEARCH=42,BOX_ROW=34,BOX_FOOT=24,BOX_VISIBLE=10;
function boxHeight(c){return BOX_HEAD+BOX_SEARCH+Math.min(c,BOX_VISIBLE)*BOX_ROW+BOX_FOOT;}
function boxListH(c){return Math.min(c,BOX_VISIBLE)*BOX_ROW;}

function childUnits(n){
  const out=[];
  if(n.children){
    n.children.forEach(c=>{if(!LEAFK.includes(c.kind))out.push({type:'node',node:c});});
    const by={}; n.children.forEach(c=>{if(LEAFK.includes(c.kind))(by[c.kind]=by[c.kind]||[]).push(c);});
    LEAFK.forEach(k=>{if(by[k])out.push({type:'box',parent:n,leaves:by[k],boxKind:k,h:boxHeight(by[k].length),x:0,y:0});});
  }
  return out;
}
function layout(){
  let cur=0;
  function place(node,depth){
    node.y=depth*ROW_H;
    const units=childUnits(node); node._units=units;
    if(units.length){
      const centers=units.map(u=>{
        if(u.type==='box'){u.x=cur+BOX_W/2;u.y=(depth+1)*ROW_H;cur+=BOX_W+H_GAP;return u.x;}
        return place(u.node,depth+1);
      });
      node.x=(centers[0]+centers[centers.length-1])/2;
    }else{node.x=cur+NODE_W/2;cur+=NODE_W+H_GAP;}
    return node.x;
  }
  place(ROOT,0);
}
function collect(){
  const tiles=[],boxes=[],links=[];
  (function w(n){tiles.push(n);(n._units||[]).forEach(u=>{
    if(u.type==='node'){links.push({s:n,t:u.node});w(u.node);}
    else{links.push({s:n,t:{x:u.x,y:u.y}});boxes.push(u);}
  });})(ROOT);
  return {tiles,boxes,links};

function descMatch(n,q){if(!q)return true;const hit=s=>(s.label||'').toLowerCase().includes(q)||Object.values(s.meta||{}).some(v=>String(v).toLowerCase().includes(q));let m=hit(n);(n._allkids||[]).forEach(c=>{m=descMatch(c,q)||m;});return m;}

  di.addEventListener('click',e=>{e.stopPropagation();selected=n;render();showDetail(n);});
  g.appendChild(di);

    else{selected=n;render();showDetail(n);}});
  gNodes.appendChild(g);
}

/* ---- leaf display ---- */
function n2(v){return Math.round(Number(v)*100)/100;}
function leafName(lf){const m=lf.meta;
  if(lf.kind==='ri'){const nm=m['Reservation Name'];return (m['Provider']==='AWS'||!nm||nm==='NA')?(m['Reservation ID']||lf.label):nm;}
  if(lf.kind==='sp')return m['Plan Name']||lf.label;
  if(lf.kind==='rirec')return (m['SKU']||'RI')+' ×'+(m['Recommended Qty']||'?');
  if(lf.kind==='sprec')return (m['Plan Type']||'SP')+' recommendation';
  if(lf.kind==='budget')return m['Budget Name']||lf.label;
  if(lf.kind==='anomaly')return ((m['Bill Date']||'')+' · '+String(m['Anomaly Type']||'').replace(/_/g,' ')).trim();
  return lf.label;}
function leafSub(lf){const m=lf.meta;
  if(lf.kind==='ri')return [m['SKU'],m['Avg Utilization %']!=null?('util '+m['Avg Utilization %']+'%'):null,m['Status']].filter(Boolean).join(' · ');
  if(lf.kind==='sp')return [m['Plan Type'],m['Utilization %']!=null?('util '+m['Utilization %']+'%'):null,m['Term']].filter(Boolean).join(' · ');
  if(lf.kind==='rirec')return [m['Region'],m['Estimated Savings']!=null?('~$'+n2(m['Estimated Savings'])+' save'):null,m['Payment Option']].filter(Boolean).join(' · ');
  if(lf.kind==='sprec')return [m['Term'],m['Savings %']!=null?(n2(m['Savings %'])+'% save'):null,m['Commitment ($/hr)']!=null?('$'+m['Commitment ($/hr)']+'/hr'):null].filter(Boolean).join(' · ');
  if(lf.kind==='budget')return [m['Budget Type'],m['Budget Amount']!=null?('$'+m['Budget Amount']):null,m['Utilization %']!=null?(m['Utilization %']+'% used'):null].filter(Boolean).join(' · ');
  if(lf.kind==='anomaly')return [m['Cost Impact']!=null?('impact $'+n2(m['Cost Impact'])):null,m['Anomaly Count']?('×'+m['Anomaly Count']):null].filter(Boolean).join(' · ');
  return '';}
function matchLeaf(lf,q){return leafName(lf).toLowerCase().includes(q)||Object.values(lf.meta||{}).some(v=>String(v).toLowerCase().includes(q));}

function drawBox(u){
  const cfg=BOXCFG[u.boxKind];
  const fo=svgEl('foreignObject',{x:u.x-BOX_W/2,y:u.y,width:BOX_W,height:u.h});
  const box=document.createElement('div'); box.className='kg-box';
  box.addEventListener('mousedown',e=>e.stopPropagation());
  const head=document.createElement('div'); head.className='kg-box-h';
  const ic=document.createElement('span'); ic.className='ic'; ic.style.background=cfg.color; ic.textContent=cfg.tag;
  const ti=document.createElement('span'); ti.className='t'; ti.textContent=cfg.title;
  const cc=document.createElement('span'); cc.className='c'; cc.textContent=u.leaves.length;
  head.append(ic,ti,cc); box.appendChild(head);
  const sw=document.createElement('div'); sw.className='kg-box-search';
  const inp=document.createElement('input'); inp.type='text'; inp.placeholder='Search '+cfg.title.toLowerCase()+'…'; inp.value=searchQ||'';
  inp.addEventListener('mousedown',e=>e.stopPropagation());
  inp.addEventListener('keydown',e=>e.stopPropagation());
  sw.appendChild(inp); box.appendChild(sw);
  const list=document.createElement('div'); list.className='kg-box-list'; list.style.maxHeight=boxListH(u.leaves.length)+'px';
  list.addEventListener('wheel',e=>e.stopPropagation());
  box.appendChild(list);
  const foot=document.createElement('div'); foot.className='kg-box-foot'; box.appendChild(foot);
  function rows(q){
    const ql=(q||'').trim().toLowerCase();
    const filt=u.leaves.filter(lf=>!ql||matchLeaf(lf,ql));
    list.innerHTML='';
    if(!filt.length){const e=document.createElement('div');e.className='kg-box-empty';e.textContent='No matches';list.appendChild(e);}
    filt.forEach(lf=>{
      const row=document.createElement('div'); row.className='kg-box-row'+(selected===lf?' active':'');
      const bar=document.createElement('div'); bar.className='kg-box-bar'; bar.style.background=cfg.color;
      if(lf.kind==='ri'&&lf.meta.Status&&lf.meta.Status.indexOf('Inactive')===0)bar.style.opacity='.4';
      const col=document.createElement('div'); col.className='col';
      const nm=document.createElement('div'); nm.className='nm'; nm.textContent=leafName(lf);
      const sb=document.createElement('div'); sb.className='sb'; sb.textContent=leafSub(lf);
      col.append(nm,sb);
      const chev=document.createElement('span'); chev.className='chev'; chev.innerHTML='&rsaquo;';
      row.append(bar,col,chev);
      row.addEventListener('click',e=>{e.stopPropagation();selectLeaf(lf,row,list);});
      list.appendChild(row);
    });
    foot.textContent=filt.length+(filt.length===1?' item':' items')+(u.leaves.length!==filt.length?(' of '+u.leaves.length):'')+(u.leaves.length>BOX_VISIBLE?' · scroll for more':'');
  }
  inp.addEventListener('input',()=>rows(inp.value));
  rows(inp.value);
  fo.appendChild(box); gNodes.appendChild(fo);
}
function selectLeaf(lf,row,list){selected=lf;
  if(list&&list.querySelectorAll){list.querySelectorAll('.kg-box-row').forEach(r=>r.classList.remove('active'));}
  if(row)row.classList.add('active');
  showDetail(lf);
}

function render(){
  layout();
  const c=collect(); LAST=c;
  gLinks.innerHTML='';
  c.links.forEach(l=>{gLinks.appendChild(svgEl('path',{d:linkPath(l.s,l.t),class:'link'+(selected&&l.t.parent&&onPath(l.t,selected)?' hl':'')}));});
  gNodes.innerHTML='';
  c.tiles.forEach(drawTile);
  c.boxes.forEach(drawBox);
  apply();
}
function toggle(n){if(!(n._allkids&&n._allkids.length))return;if(n.children){n._children=n.children;n.children=null;}else{n.children=n._children;n._children=null;}}
function hasSub(n){return !!subLine(n);}
function subLine(n){const m=n.meta||{};
  if(n.kind==='tenant')return (m['Cloud Accounts']||0)+' accounts · '+(m['Reserved Instances']||0)+' RI · '+(m['Savings Plans']||0)+' SP';
  if(n.kind==='provider')return (m['Reserved Instances']||0)+' RI · '+(m['Savings Plans']||0)+' SP';
  if(n.kind==='account')return m['Account ID']?('id '+trim(m['Account ID'],10)):'';
  if(n.kind==='region')return (m['Reserved Instances']||0)+' RIs';
  return '';}
function onPath(node,sel){let c=sel;while(c){if(c===node)return true;c=c.parent;}return false;}

/* ---- aggregation ---- */
function descNodes(n){const out=[];(function w(x){out.push(x);(x._allkids||[]).forEach(w);})(n);return out;}
function aggregate(n){
  const all=descNodes(n),ris=all.filter(x=>x.kind==='ri'),sps=all.filter(x=>x.kind==='sp');
  const num=v=>{const f=Number(v);return isNaN(f)?0:f;};
  const active=ris.filter(x=>x.meta.Status&&x.meta.Status.indexOf('Active')===0).length;
  const rc=ris.reduce((a,x)=>a+num(x.meta['Reservation Cost']),0),od=ris.reduce((a,x)=>a+num(x.meta['On-Demand Equivalent']),0),ns=ris.reduce((a,x)=>a+num(x.meta['Net Savings']),0);
  const us=ris.map(x=>x.meta['Avg Utilization %']).filter(v=>v!=null).map(Number);
  const avgU=us.length?(us.reduce((a,b)=>a+b,0)/us.length):null;
  const skus=new Set(ris.map(x=>x.meta.SKU).filter(Boolean));
  const spCommit=sps.reduce((a,x)=>a+num(x.meta['Commitment ($/hr)']),0);
  const recSave=all.filter(x=>x.kind==='rirec').reduce((a,x)=>a+num(x.meta['Estimated Savings']),0);
  const anomImpact=all.filter(x=>x.kind==='anomaly').reduce((a,x)=>a+num(x.meta['Cost Impact']),0);
  return {ri:ris.length,sp:sps.length,active,inactive:ris.length-active,rc,od,ns,rate:od>0?(ns/od*100):null,avgU,skus:skus.size,
    accounts:all.filter(x=>x.kind==='account').length,regions:all.filter(x=>x.kind==='region').length,providers:all.filter(x=>x.kind==='provider').length,spCommit,
    rirec:all.filter(x=>x.kind==='rirec').length,sprec:all.filter(x=>x.kind==='sprec').length,budget:all.filter(x=>x.kind==='budget').length,anomaly:all.filter(x=>x.kind==='anomaly').length,
    recSave,anomImpact,
    units:childUnitsSummary(n)};
}
function childUnitsSummary(n){
  const kids=n._allkids||[]; const nodeKids=kids.filter(c=>!LEAFK.includes(c.kind));
  const groups={}; kids.forEach(c=>{if(LEAFK.includes(c.kind))groups[c.kind]=(groups[c.kind]||0)+1;});
  return {nodeKids,groups};
}

const detail=document.getElementById('detail'),detailInner=document.getElementById('detailInner');
const HIDE_KEYS=new Set(['_leaf']);
function statTile(v,l){return `<div class="dt-stat"><div class="v">${v}</div><div class="l">${l}</div></div>`;}
function kvRow(k,v){let val=v;
  if(k==='Status')val=`<span class="pill ${String(v).indexOf('Active')===0?'ok':'off'}">${v}</span>`;
  else if(k==='Auto Renew'||k==='Tenant Level'||k==='CoreStack Created')val=`<span class="pill ${v==='Yes'?'ok':'off'}">${v}</span>`;
  return `<div class="kv"><span class="k">${escapeHtml(k)}</span><span class="v">${val}</span></div>`;}
function money(v){return v==null?'–':'$'+Number(v).toLocaleString(undefined,{maximumFractionDigits:2});}
function bar(pct,color){const p=Math.max(0,Math.min(100,pct||0));return `<div class="dt-bar"><div class="dt-bar-fill" style="width:${p}%;background:${color}"></div></div>`;}
function sparkline(series){
  series=(series||[]).filter(p=>p.u!=null); if(!series.length)return '';
  const w=300,h=64,pad=18,bw=Math.max(6,(w-pad*2)/series.length-6); let bars='';
  series.forEach((p,i)=>{const x=pad+i*((w-pad*2)/series.length),bh=Math.max(2,(p.u/100)*(h-22));
    const col=p.u>=90?'#36B37E':p.u>=50?'#F5CC00':'#C4461E';
    bars+=`<rect x="${x.toFixed(1)}" y="${(h-2-bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="2" fill="${col}"><title>${p.m}: ${p.u}%</title></rect>`;
    if(i%Math.ceil(series.length/6||1)===0)bars+=`<text x="${(x+bw/2).toFixed(1)}" y="${h}" font-size="8" fill="#959FAE" text-anchor="middle">${(p.m||'').slice(2)}</text>`;});
  return `<svg viewBox="0 0 ${w} ${h+6}" style="width:100%;height:${h+6}px;margin-top:6px">${bars}</svg>`;}
function attrs(m){return Object.entries(m).filter(([kk])=>!HIDE_KEYS.has(kk)).map(([kk,v])=>kvRow(kk,v)).join('');}

function showDetail(n){
  detail.classList.remove('hidden');document.getElementById('legend').classList.remove('full');
  const k=KIND[n.kind],col=n.kind==='provider'?provColor():k.raw,path=breadcrumb(n);

    const a=aggregate(n);
    stats=`<div class="dt-stats">${statTile(a.ri,'Reserved Inst.')}${statTile(a.sp,'Savings Plans')}${statTile(money(a.ns),'Net Savings')}${statTile(a.avgU!=null?a.avgU.toFixed(0)+'%':'–','Avg RI Util')}</div>`;
    body+=`<div class="dt-sec">Commitment rollup</div>`+kvRow('Active RIs',a.active)+kvRow('Inactive / expired RIs',a.inactive)+kvRow('Total reservation cost',money(a.rc))+kvRow('On-demand equivalent',money(a.od))+kvRow('Total net savings',money(a.ns));
    if(a.rate!=null)body+=kvRow('Savings rate',a.rate.toFixed(1)+'%');
    if(a.avgU!=null)body+=kvRow('Avg RI utilization',a.avgU.toFixed(1)+'%');
    body+=kvRow('Distinct SKUs',a.skus);
    if(a.sp)body+=kvRow('SP hourly commitment',money(a.spCommit));
    body+=`<div class="dt-sec">Advisory &amp; monitoring</div>`+
      kvRow('RI recommendations',a.rirec)+(a.rirec?kvRow('Est. RI rec. savings',money(a.recSave)):'')+
      kvRow('SP recommendations',a.sprec)+kvRow('Budgets',a.budget)+
      kvRow('Anomaly days',a.anomaly)+(a.anomaly?kvRow('Total anomaly impact',money(a.anomImpact)):'');
    if(n.kind==='tenant')body+=`<div class="dt-sec">Footprint</div>`+kvRow('Cloud providers',a.providers)+kvRow('Cloud accounts',a.accounts)+kvRow('Regions',a.regions);
    if(n.kind==='provider')body+=`<div class="dt-sec">Footprint</div>`+kvRow('Cloud accounts',a.accounts)+kvRow('Regions',a.regions);
    if(n.kind==='account')body+=kvRow('Regions',a.regions);
    const u=a.units; const rowsB=[];
    u.nodeKids.forEach(c=>rowsB.push([c.label,(c.meta['Reserved Instances']||0)+' RI · '+(c.meta['Savings Plans']||0)+' SP']));
    Object.keys(u.groups).forEach(kk=>rowsB.push([BOXCFG[kk].title,u.groups[kk]]));
    if(rowsB.length){body+=`<div class="dt-sec">Breakdown</div>`+rowsB.map(r=>`<div class="kv"><span class="k">${escapeHtml(r[0])}</span><span class="v">${r[1]}</span></div>`).join('');}
  }else if(n.kind==='ri'){
    const m=n.meta,od=Number(m['On-Demand Equivalent']),ns=Number(m['Net Savings']),rate=od>0?(ns/od*100):null;
    stats=`<div class="dt-stats">${statTile(m['Avg Utilization %']!=null?m['Avg Utilization %']+'%':'–','Avg Util')}${statTile(money(m['Net Savings']),'Net Savings')}${statTile(rate!=null?rate.toFixed(0)+'%':'–','Savings Rate')}${statTile(m['Quantity']||'–','Quantity')}</div>`;
    if(n.xtra&&n.xtra.series&&n.xtra.series.some(p=>p.u!=null))body+=`<div class="dt-sec">Monthly utilization</div>${sparkline(n.xtra.series)}`;
    body+=`<div class="dt-sec">Attributes</div>`+attrs(m);
  }else if(n.kind==='sp'){
    const m=n.meta;
    stats=`<div class="dt-stats">${statTile(m['Utilization %']!=null?m['Utilization %']+'%':'–','Utilization')}${statTile(money(m['Commitment ($/hr)']),'$/hr Commit')}${statTile(m['Number of Plans']||'–','# Plans')}${statTile(money(m['Upfront Cost']),'Upfront')}</div>`;
    body+=`<div class="dt-sec">Attributes</div>`+attrs(m);
  }else if(n.kind==='rirec'){
    const m=n.meta;
    stats=`<div class="dt-stats">${statTile(money(m['Estimated Savings']),'Est. Savings/mo')}${statTile(m['Recommended Qty']||'–','Rec. Qty')}${statTile(m['Offering Class']||'–','Class')}${statTile((m['Payment Option']||'–').replace(/_/g,' '),'Payment')}</div>`;
    body+=`<div class="dt-sec">Recommendation</div>`+attrs(m);
  }else if(n.kind==='sprec'){
    const m=n.meta;
    stats=`<div class="dt-stats">${statTile(m['Savings %']!=null?n2(m['Savings %'])+'%':'–','Savings %')}${statTile(money(m['Commitment ($/hr)']),'$/hr Commit')}${statTile(m['Term']||'–','Term')}${statTile(m['Number of Plans']||'–','# Plans')}</div>`;
    body+=`<div class="dt-sec">Recommendation</div>`+attrs(m);
  }else if(n.kind==='budget'){
    const m=n.meta;
    stats=`<div class="dt-stats">${statTile(money(m['Budget Amount']),'Amount')}${statTile(money(m['Current Spend']),'Current')}${statTile(m['Utilization %']!=null?m['Utilization %']+'%':'–','Used')}${statTile(m['Period']||'–','Period')}</div>`;
    if(m['Utilization %']!=null)body+=`<div class="dt-sec">Budget consumption</div>${bar(m['Utilization %'],m['Utilization %']>100?'#DE350B':m['Utilization %']>80?'#FF9F1C':'#36B37E')}<div class="dt-barcap">${m['Utilization %']}% of ${money(m['Budget Amount'])} used</div>`;
    body+=`<div class="dt-sec">Attributes</div>`+attrs(m);
  }else if(n.kind==='anomaly'){
    const m=n.meta;
    stats=`<div class="dt-stats">${statTile(money(m['Cost Impact']),'Cost Impact')}${statTile(money(m['Actual Cost']),'Actual')}${statTile(money(m['Expected Cost']),'Expected')}${statTile(m['Anomaly Count']||'–','Count')}</div>`;
    body+=`<div class="dt-sec">Anomaly</div>`+attrs(m);
  }
  detailInner.innerHTML=`<div class="dt-head"><button class="dt-close" onclick="closeDetail()">✕</button><span class="dt-kind" style="background:${col}">${dotIco()} ${k.label}</span><div class="dt-name">${escapeHtml(title)}</div><div class="dt-path">${path}</div></div>${stats}<div class="dt-body">${body||'<div style="color:#959FAE;font-size:13px;padding:8px 0">No additional attributes.</div>'}</div>`;
}
function closeDetail(){detail.classList.add('hidden');selected=null;document.getElementById('legend').classList.add('full');render();}
function breadcrumb(n){const a=[];let c=n.parent;while(c){a.unshift(escapeHtml(c.label));c=c.parent;}return a.join(' › ')||'Root';}
function dotIco(){return '<svg width="11" height="11" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" fill="#fff" opacity=".9"/></svg>';}

let drag=null;
svg.addEventListener('mousedown',e=>{drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};svg.classList.add('grabbing');});
window.addEventListener('mousemove',e=>{if(!drag)return;view.x=drag.vx+(e.clientX-drag.x);view.y=drag.vy+(e.clientY-drag.y);apply();});
window.addEventListener('mouseup',()=>{drag=null;svg.classList.remove('grabbing');});
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,f=e.deltaY<0?1.12:1/1.12,nk=Math.min(2.4,Math.max(0.16,view.k*f));view.x=mx-(mx-view.x)*(nk/view.k);view.y=my-(my-view.y)*(nk/view.k);view.k=nk;apply();},{passive:false});

function bbox(){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  LAST.tiles.forEach(n=>{x0=Math.min(x0,n.x-NODE_W/2);x1=Math.max(x1,n.x+NODE_W/2);y0=Math.min(y0,n.y);y1=Math.max(y1,n.y+NODE_H);});
  LAST.boxes.forEach(u=>{x0=Math.min(x0,u.x-BOX_W/2);x1=Math.max(x1,u.x+BOX_W/2);y0=Math.min(y0,u.y);y1=Math.max(y1,u.y+u.h);});
  if(x0>x1){x0=0;y0=0;x1=NODE_W;y1=NODE_H;}
  return {x0,y0,x1,y1,w:x1-x0,h:y1-y0};}
function fit(){const b=bbox(),r=svg.getBoundingClientRect(),pad=56;const k=Math.min((r.width-pad*2)/b.w,(r.height-pad*2)/b.h,1.4);view.k=Math.max(0.14,k);view.x=(r.width-b.w*view.k)/2-b.x0*view.k;view.y=pad-b.y0*view.k;apply();}

function trim(s,n){s=String(s);return s.length>n?s.slice(0,n-1)+'…':s;}
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function shade(hex,p){const c=hex.replace('#','');const num=parseInt(c.length===3?c.split('').map(x=>x+x).join(''):c,16);let r=(num>>16)+p,g=((num>>8)&255)+p,b=(num&255)+p;r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));return '#'+(r<<16|g<<8|b).toString(16).padStart(6,'0');}

<script>
/* ===== Knowledge / Ontology Browser modal wiring ===== */
function agxOntoDark(){ return document.body.classList.contains('dark'); }
function agxSyncOntoTheme(){
  var frame=document.getElementById('ontoFrame');
  try{ var d=frame.contentDocument; if(d&&d.body){ d.body.classList.toggle('dark', agxOntoDark()); } }catch(e){}
}
function agxOpenKnowledge(){
  var modal=document.getElementById('ontoModal');
  var frame=document.getElementById('ontoFrame');
  if(!frame.getAttribute('data-loaded')){
    var tpl=document.getElementById('ontoDoc');
    frame.onload=agxSyncOntoTheme;
    var dark=agxOntoDark()?' class="dark"':'';
    var doc='<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body'+dark+'>'+tpl.innerHTML+'</body></html>';
    frame.setAttribute('srcdoc',doc);
    frame.setAttribute('data-loaded','1');
  } else {
    agxSyncOntoTheme();
  }
  modal.classList.add('open');
  modal.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
}
function agxCloseKnowledge(){
  var modal=document.getElementById('ontoModal');
  if(!modal)return;
  modal.classList.remove('open');
  modal.setAttribute('aria-hidden','true');
  document.body.style.overflow='';
}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){var m=document.getElementById('ontoModal');if(m&&m.classList.contains('open'))agxCloseKnowledge();}
});
</script>
